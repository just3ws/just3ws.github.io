name: Deploy Committed Site

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: bin/generate_last_modified.rb derives per-file dates
          # via `git log -1 --format=%cI`. A shallow (depth-1) checkout collapses
          # every file to the tip commit's date, so last_modified.yml regenerates
          # differently than committed and fails validate:generated_freshness.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.6'
          bundler-cache: true
      - name: Run CI gate
        run: ./bin/pipeline ci
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-reports
          path: |
            tmp/seo-metadata-report.json
            tmp/schema-coverage-report.json
          if-no-files-found: warn
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
