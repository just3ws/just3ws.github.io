<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Now Watching HUD: The Sound Above</title>
  <link rel="stylesheet" href="css/craftsmanship-theme.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      position: relative;
    }

    .now-watching-card {
      position: absolute;
      top: 40px;
      right: 50px;
      width: 440px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-left: 4px solid var(--teal-craftsman);
      background: rgba(255, 255, 255, 0.96);
      border-top: 1px solid rgba(227, 223, 215, 0.9);
      border-right: 1px solid rgba(227, 223, 215, 0.9);
      border-bottom: 1px solid rgba(227, 223, 215, 0.9);
      box-shadow: 0 16px 40px rgba(45, 35, 20, 0.08), 0 4px 12px rgba(45, 35, 20, 0.04);
      animation: fade-in 0.4s ease-out;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--ink-heading);
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-family: var(--font-display);
    }

    .hud-event {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--amber-accent);
      font-weight: 600;
    }

    .hud-meta {
      font-size: 13.5px;
      color: #334155;
      line-height: 1.45;
    }

    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid rgba(227, 223, 215, 0.9);
      font-family: var(--font-heritage);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      color: var(--teal-craftsman);
      font-weight: 700;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="stream-panel now-watching-card">
    <div class="hud-header">
      <div class="pill-badge">
        <span class="indicator-dot"></span>
        <span>NOW WATCHING</span>
      </div>
      <span class="mono-label" id="hud-era">THE CHICAGO CRUCIBLE</span>
    </div>

    <div class="hud-title">
      <span id="hud-interviewee">Sergio Pereira</span>
      <span class="hud-event" id="hud-conference">SCNA 2011</span>
    </div>

    <div class="hud-meta" id="hud-topic">
      Escaping corporate silos: Building Chicago Alt.NET and grassroots community before commercial platforms.
    </div>

    <div class="hud-footer">
      <span>WHOIS TECH COMMUNITY REWATCH</span>
      <span>HOST: MIKE HALL (#106)</span>
    </div>
  </div>

  <script src="js/overlay-controller.js"></script>
  <script>
    new OverlayController({
      stateUrl: "overlay-state.json",
      onUpdate: (state) => {
        const ep = state.episode;
        document.getElementById("hud-interviewee").textContent = ep.interviewee;
        document.getElementById("hud-conference").textContent = `${ep.conference} (${ep.year})`;
        document.getElementById("hud-topic").textContent = ep.title;
        document.getElementById("hud-era").textContent = ep.era.toUpperCase();
      }
    });
  </script>
</body>
</html>
