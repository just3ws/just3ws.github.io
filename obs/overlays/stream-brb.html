<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Intermission: The Sound Above</title>
  <link rel="stylesheet" href="css/craftsmanship-theme.css">
  <style>
    body {
      width: 1920px;
      height: 1080px;
      background: radial-gradient(circle at 50% 40%, #fffdfa 0%, #fbf8f2 50%, #f3ece0 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 100px;
      font-family: var(--font-sans);
      color: var(--ink-main);
    }

    .brb-box {
      max-width: 860px;
      padding: 52px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(227, 223, 215, 0.95);
      box-shadow: 0 16px 40px rgba(45, 35, 20, 0.08), 0 4px 12px rgba(45, 35, 20, 0.04);
      border-radius: var(--radius-lg);
    }

    .brand-cube-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(45, 35, 20, 0.12));
    }

    .brb-badge {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.15em;
      color: var(--teal-craftsman);
      text-transform: uppercase;
      font-weight: 700;
    }

    h1 {
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--ink-heading);
      font-family: var(--font-display);
      margin: 0;
    }

    p.subtitle {
      font-size: 18px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 600px;
      margin: 0;
    }

    .topic-pill {
      margin-top: 6px;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      background: rgba(15, 118, 110, 0.08);
      border: 1px solid rgba(15, 118, 110, 0.25);
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--teal-craftsman);
      font-weight: 600;
    }

    .footer-note {
      margin-top: 24px;
      font-family: var(--font-heritage);
      font-size: 11.5px;
      color: var(--amber-accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="stream-panel brb-box">
    <img class="brand-cube-logo" src="assets/ugtastic-cube-logo.png" alt="UGtastic">
    <div class="pill-badge">
      <span class="indicator-dot"></span>
      <span>SHORT INTERMISSION</span>
    </div>

    <h1>Holding the Thread</h1>

    <p class="subtitle">
      Stepping away from the workbench for a moment.
      The discussion will resume shortly.
    </p>

    <div class="topic-pill" id="brb-topic">
      Current Rewatch: Sergio Pereira (SCNA 2011)
    </div>

    <div class="footer-note">
      WHOIS TECH COMMUNITY · LEARNING ABOUT PEOPLE · ONE INTERVIEW AT A TIME
    </div>
  </div>

  <script src="js/overlay-controller.js"></script>
  <script>
    new OverlayController({
      stateUrl: "overlay-state.json",
      onUpdate: (state) => {
        const ep = state.episode;
        document.getElementById("brb-topic").textContent = `Current Rewatch: ${ep.interviewee} (${ep.conference})`;
      }
    });
  </script>
</body>
</html>
