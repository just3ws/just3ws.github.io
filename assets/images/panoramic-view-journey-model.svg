<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title description">
  <title id="title">Panoramic View journey and system wave</title>
  <desc id="description">A person moves from entry to exit while each interaction travels down through software layers and returns as the next visible state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#faf8f5"/>
  <g fill="#fff" stroke="#e3dfd7" stroke-width="2">
    <rect x="145" y="95" width="700" height="54" rx="8"/>
    <rect x="145" y="158" width="700" height="54" rx="8"/>
    <rect x="145" y="221" width="700" height="54" rx="8"/>
    <rect x="145" y="284" width="700" height="54" rx="8"/>
    <rect x="145" y="347" width="700" height="54" rx="8"/>
  </g>
  <g fill="#525866" font-family="system-ui, sans-serif" font-size="18">
    <text x="24" y="128">Interface</text>
    <text x="24" y="191">Application</text>
    <text x="24" y="254">Services</text>
    <text x="24" y="317">Integration</text>
    <text x="24" y="380">Data / state</text>
  </g>
  <path d="M150 58H838" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <g fill="#0f766e" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    <text x="148" y="35">Enter</text>
    <text x="420" y="35">Act · pause · branch</text>
    <text x="778" y="35">Exit</text>
  </g>
  <g fill="none" stroke="#b45309" stroke-width="3" marker-end="url(#arrow)">
    <path d="M245 105C245 210 245 355 315 378 385 355 385 210 385 105"/>
    <path d="M465 105C465 210 465 355 535 378 605 355 605 210 605 105"/>
    <path d="M665 105C665 210 665 355 720 378 775 355 775 210 775 105"/>
  </g>
  <g fill="#0f766e" stroke="#fff" stroke-width="3">
    <circle cx="245" cy="105" r="8"/><circle cx="385" cy="105" r="8"/>
    <circle cx="465" cy="105" r="8"/><circle cx="605" cy="105" r="8"/>
    <circle cx="665" cy="105" r="8"/><circle cx="775" cy="105" r="8"/>
  </g>
  <g fill="#525866" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
    <text x="224" y="435">choose</text>
    <text x="445" y="435">commit</text>
    <text x="660" y="435">receive</text>
  </g>
</svg>
