# ─────────────────────────────────────────────────────────────────
# 4. TRACK A: 6-ACT TELEPROMPTER SCRIPT
# ─────────────────────────────────────────────────────────────────
teleprompter_script:
  act_1: |
    [SCENE: 01. Starting Soon -> 02. Monologue / Full Camera.]
    Welcome to The Sound Above. I am Mike Hall.

    For Episode 2, I am going back to November 19, 2011, at Software Craftsmanship North America at the Swissotel in downtown Chicago.
    My interview is with Ray Hightower, founding organizer of ChicagoRuby and president of WisdomGroup.

    [PAUSE]
    When I first started attending user groups in Chicago, walking into a room full of experienced engineers was intimidating.
    Ray Hightower was the person standing by the door making sure every single person felt welcomed.
    He proved that technical excellence is hollow without radical hospitality.

  act_2: |
    [SCENE: 02. Monologue / Full Camera.]
    ChicagoRuby began with just five developers meeting in a library basement in Franklin Park.
    When Ray took over as organizer, he set two foundational rules: consistency and team leadership.

    Members knew a year in advance that ChicagoRuby would meet on the first Tuesday of every month at 6:30 PM.
    Even when they did not know the speaker, they knew the date, time, and place.

    From the library basement, the group grew into the Aon Center downtown, hosting over one hundred people each month.
    They established hack nights, coding dojos in Elmhurst, and eventually the WindyCityRails conference.

  act_3: |
    [SCENE: 04. Split Screen.]
    In the research pane, we have three recovered primary-source receipts:
    First, the 2008 ChicagoRuby GitHub repository documentation on how the organizer team functioned.
    Second, the 2011 SCNA schedule showing how Ray connected open-source Ruby developers with enterprise .NET craftsmen.
    Third, the historical photos of the Elmhurst clubhouse basement where Saturday coding dojos took place.

    This brings us to our core question:
    What sustained a monthly practitioner community across twenty years without corporate decay?
    Let us roll the tape.

  act_4: |
    [SCENE: 03. Reaction / 04. Split Screen - Live Rewatch Cues (No Script Read Aloud).]
    00:00 - Intro & Tone: Operations focus and community welcoming.
    02:15 - Franklin Park Origin: Five people in a suburban library.
    04:30 - Relentless Consistency: 1st Tuesday at 6:30 PM booked a year in advance.
    06:45 - Radical Inclusion: No barriers; creating a genuine clubhouse for everyone.

  act_5: |
    [SCENE: 02. Monologue / Full Camera.]
    Watching Ray describe those early days reminds us of a critical truth.
    In the interactive transcript at Turn 37, Ray says: 'With consistency, everybody can plan around that. And once you have that, then you want to get good speakers.'

    In 2026, tech communities are fragmented across remote video calls and algorithmic social feeds.
    We often think building community requires venture sponsorship or complex platforms.
    Ray proved that community is built on physical consistency, shared bread, and the courage to welcome newcomers.

  act_6: |
    [SCENE: 08. Outro / Closing Credits.]
    Thank you to Ray Hightower for demonstrating how leadership is service, and for welcoming so many of us into the Chicago craft community.

    The full interactive transcript, historical photos, and ChicagoRuby organizing guides are linked on the episode page at just3ws.com.
    If you attended ChicagoRuby or WindyCityRails, leave a comment and share your memory.

    Next time, Micah Martin and Mike Jansen take us inside 8th Light to examine residential software apprenticeship and martial arts waza practice.
    Until then, keep your feedback loops tight, take care of each other, and keep making room to learn.

