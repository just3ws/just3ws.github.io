<nav class="resume-subnav no-print" aria-label="Resume actions">
  <div class="subnav-group">
    <a href="/history/" class="subnav-link">Full Timeline</a>
    <span>Variants:</span>
    {% for pair in site.data.resume.archetypes %}
      {% assign a = pair[1] %}
      <a href="/resumes/{{ a.file_slug }}/" class="subnav-link" title="{{ a.target_tier }}">{{ a.title | split: "/" | first | strip | truncate: 22, "" }}</a>
    {% endfor %}
  </div>
  <div class="subnav-group">
    <span>Download:</span>
    <a href="/resume.txt" class="subnav-link">TXT</a>
    <a href="/resume.md" class="subnav-link">MD</a>
    <a href="/resume.json" class="subnav-link">JSON</a>
    <button onclick="window.print()" class="subnav-btn">Print PDF</button>
  </div>
</nav>
