- id: sharpresume
  title: "#Resume (SharpResume), NStun & Frog's Brain Open-Source Suite"
  years: 2006 - 2009
  role: Creator & Project Coordinator
  description: >-
    Early open-source C# / .NET Framework 2.0 (v2.0.50727, Visual Studio 2005)
    libraries published on CodePlex, Google Code, and FrogsBrain.net under the MIT License
    (Copyright 2006-2009 Just3Ws, Inc. / FrogsBrain.net). Includes NStun (FrogsBrain.NStun,
    native C# RFC 3489 STUN UDP NAT traversal protocol engineered while solving real-time
    distributed ticket broker connectivity at TicketsNow), #Resume (Just3Ws.SharpResume,
    strongly typed C# object model, XML serialization engine, and ASP.NET Builder implementing
    the HR-XML Consortium 2.5 Resume specification), and SchemaInSight (programmatic SQL
    Server schema inspection API).
  url: https://codeplexarchive.org/project/sharpresume
