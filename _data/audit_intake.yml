sections:
  - title: System Architecture
    description: Provide high-level context about your Rails and Postgres environment.
    fields:
      - label: Primary Pain Point
        type: select
        options:
          - The "Crusty" Monolith (Upgrade Blockers / Security)
          - Topography Blind Spots (No "Panoramic View" of Data)
          - AI Readiness / Brittle Data Foundation
          - Silent Record Loss / Sync Issues
          - Slow Queries / Lock Contention
          - Background Job / Sidekiq Anomalies
          - Recurring Incidents / Ghost Bugs
          - Other (Please specify)
        required: true
      - label: Symptom Description
        type: textarea
        placeholder: "Describe exactly what is happening (or not happening) in production."
        required: true

  - title: Diagnostic Surface
    description: To prepare for our Strategy Session, please indicate which diagnostic signals are currently available in your environment.
    fields:
      - label: Observability Stack
        type: textarea
        placeholder: "e.g., Datadog, New Relic, pganalyze, CloudWatch, etc."
        required: true
      - label: Logging Depth
        type: select
        options:
          - We have correlated Request/Correlation IDs end-to-end
          - We have standard Rails logs (no correlation)
          - Our logging is thin/non-existent
          - I'm not sure
        required: true
      - label: Non-Production Parity
        type: checkbox
        description: "We have a staging or sandbox environment where we can safely reproduce business processes."

  - title: Access & Timeline
    fields:
      - label: Requested Start Date
        type: date
        required: true
      - label: Technical Lead Available?
        type: checkbox
        description: "A technical lead or architect will be available for a 90-minute discovery call."
