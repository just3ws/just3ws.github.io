- slug: railsconf-2014
  name: RailsConf 2014
  conference: RailsConf
  year: 2014
  start_date: '2014-04-22'
  end_date: '2014-04-25'
  location: Chicago, IL
  description: Interviews recorded at RailsConf 2014.
  summary: >-
    RailsConf 2014 in Chicago marked a watershed moment in the Ruby ecosystem, framed by David Heinemeier Hansson's keynote declaring that dogmatic TDD had created test-induced design damage. The 16 recorded interviews capture both sides of this architectural reckoning alongside community maturation: core framework internals, debugging workflows, memory profiling, open-source maintainer empathy, and technical leadership. Featured interviewees include David Heinemeier Hansson (DHH), Aaron Patterson, Coraline Ada Ehmke, Yehuda Katz, Carlos Antonio da Silva, Alexander Dymo, and Justin Collins.
  highlights:
  - 'Coverage: 16 on-site interviews recorded in Chicago across April 22-25, 2014.'
  - 'Core Conference Theme: The architectural testing reckoning ignited by DHH''s "Writing Software" keynote, debated against craftsmanship and isolated unit-testing philosophies.'
  - 'Framework Runtime & Tooling Maturation: Deep dives into Ruby 2.1 generational garbage collection (Alexander Dymo), Puma and Rubinius (Evan Phoenix), Heroku production operations (Richard Schneeman), and Pry debugger loops (Joel Turnbull).'
  - 'Ecosystem & Community Stewardship: Conversations exploring engineering leadership and apprenticeship (Coraline Ada Ehmke), security tooling with Brakeman (Justin Collins), Rails core maintenance (Carlos Antonio da Silva), and mental health in software (Greg Baugues).'
  sample_people:
  - Aaron Patterson
  - Alexander Dymo
  - Carlos Antonio da Silva
  - Coraline Ada Ehmke
  - David Heinemeier Hansson (DHH)
  - Evan Light
  sample_topics:
  - Artis and engineering leadership
  - Brakeman and Rails security
  - DCamp and developer community building
  - Debugger Driven Development
  - Ember.js and frontend architecture
  - Fluentd and log integration tooling
