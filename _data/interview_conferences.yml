  location: Swissotel Chicago, Chicago, IL
  description: UGtastic interviews recorded at Software Craftsmanship North America
    2011.
  summary: >-
    Held on-site at the Swissotel Chicago on November 18-19, 2011, SCNA 2011 served as the official public launchpad for the UGtastic oral history project. The 14 recorded interviews document regional software craftsmanship and Alt.NET user groups convening across North America and the UK, focusing on deliberate practice, peer pairing, coding dojos, and community stewardship. Featured interviewees include Sergio Pereira (Chicago Alt.NET), Ray Hightower (ChicagoRuby), Sandro Mancuso (London Software Craftsmanship), Michael Norton, and Bobby Johnson.
  highlights:
  - 'Coverage: 14 interviews recorded on-site at the Swissotel Chicago downtown on the Chicago River across November 18-19, 2011.'
  - 'UGtastic Official Launch: The foundational conference where Mike Hall initiated live oral history recordings of developer communities and craftsmen.'
  - 'Cross-Community Federation: Bridges built between Chicago Alt.NET (Sergio Pereira), ChicagoRuby (Ray Hightower), London Software Craftsmanship (Sandro Mancuso), Boston, Denver, DC, and Cleveland communities.'
  - 'Practitioner Standards: Dialogues exploring deliberate practice, test-driven craftsmanship, and user-group stewardship across technology boundaries.'
