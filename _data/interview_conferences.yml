- slug: scna-2012
  name: SCNA 2012
  conference: SCNA
  year: 2012
  start_date: '2012-11-09'
  end_date: '2012-11-10'
  location: Mid-America Club (Aon Center), Chicago, IL
  description: UGtastic interviews recorded at Software Craftsmanship North America
    2012.
  summary: >-
    Held on the 80th floor of Chicago's Aon Center at the Mid-America Club on November 9-10, 2012, SCNA 2012 brought together 21 recorded interviews exploring software craftsmanship, architectural boundaries, and learning pedagogy. Highlights of the event included Gary Bernhardt's landmark "Boundaries" talk introducing the Functional Core, Imperative Shell architecture, alongside live Clojure kata battles and deep inquiries into mentorship, developer shame, and apprenticeship. Featured interviewees include Gary Bernhardt, Robert "Uncle Bob" Martin, Sandro Mancuso, Leon Gersing, Cory Foy, Brian Marick, Colin Jones, and Jen Myers.
  highlights:
  - 'Coverage: 21 on-site interviews recorded at the Mid-America Club in Chicago across November 9-10, 2012.'
  - 'Architectural Boundaries & Isolation: Gary Bernhardt''s debut of "Boundaries," redefining how developers separate pure logic from imperative I/O and side effects.'
  - 'Pedagogy, Mentorship & Apprenticeship: Investigations into second-language acquisition models for code (Cory Foy), overcoming developer shame and finding joy (Leon Gersing), and apprentice training (Colin Jones, 8th Light).'
  - 'Craftsmanship Scale & Community Reach: Sandro Mancuso on the international expansion of Software Craftsmanship Communities (LSCC) and Robert Martin on performance craft.'
  sample_people:
  - Brad Wilkening
  - Brian Marick
  - Carl Erickson
  - Colin Jones
