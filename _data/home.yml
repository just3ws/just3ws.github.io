hero:
  eyebrow: "Hands-on Director of Engineering"
  headline: "Stabilize what is fragile. Understand what is real. Move forward with confidence."
  lede: >-
    I lead teams through complex systems and consequential change. My work
    connects deep technical investigation, shared system understanding, and the
    operating structures people need to modernize safely.
  actions:
    - label: "Review my experience"
      href: "/"
      style: "primary"
    - label: "Explore Panoramic View"
      href: "/panoramic-view/"
      style: "secondary"

through_line:
  title: "Broad experience. One operating pattern."
  text: >-
    Architecture, production diagnosis, observability, delivery, knowledge
    recovery, and team design are not separate concerns when the system is hard
    to understand. I map the business perspective to system operation at every
    point they intersect, follow cause and effect across those boundaries, and
    help capable people act on a shared account of reality.

evidence:
  - context: "Regulated multi-team enterprise"
    title: "Institutional knowledge that traveled without its author"
    text: >-
      I connected customer journeys to runtime behavior across technology and
      ownership boundaries. Years later, on two separate occasions, colleagues
      who did not know I had created the material used its documentation to train
      me on the system.
    link_label: "See how the method works"
    href: "/panoramic-view/#application-enterprise"
  - context: "Small acquired software organization"
    title: "A shared operating picture during founder transition"
    text: >-
      In 52 working days, I established structured knowledge capture, read-only
      operational visibility, explicit risk ownership, team decision rhythms,
      and a sequenced stabilization path for a distributed engineering team.
    link_label: "Read the anonymized application"
    href: "/panoramic-view/#application-founder-transition"
  - context: "Current hands-on practice"
    title: "Still designing, building, testing, and shipping"
    text: >-
      Phalanx Duel is my current product laboratory: a deterministic tactical
      card game built around explicit state, observable rules, reproducible
      simulation, accessibility, and AI-assisted engineering discipline.
    link_label: "Review selected work"
    href: "/portfolio/#project-phalanx-duel"

