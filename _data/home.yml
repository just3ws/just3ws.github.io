operating_pattern:
  label: "How I work"
  steps:
    - name: "Stabilize"
      summary: "Find the immediate risks and make production safe enough to investigate."
    - name: "Understand"
      summary: "Trace the real workflow across code, data, infrastructure, and teams."
    - name: "Improve"
      summary: "Use the shared picture to plan and ship safer changes."

through_line:
  label: "What I do"
  title: "Technical leadership that stays close to the code."
  text: >-
    My best work starts when no one person has the whole picture. Over the past 20+ years,
    I have served as Acquisition Lane Architect at OneMain Financial, CTO of venture-backed startups,
    and steward of distributed platforms. I trace failures end to end, clarify ownership, and turn
    what I learn into architecture decisions teams can trust.

method:
  eyebrow: "Panoramic View"
  title: "Start with what the system actually does."
  lede: >-
    Panoramic View is my practical framework for legacy modernization: map the business process,
    trace what the software actually does across runtime boundaries, and resolve the differences before changing anything.
  actor_note: >-
    The user of the system might be a customer, an employee, an automated process, or
    an AI agent. The same questions apply.
  evidence_note: >-
    Logs, traces, diagrams, documentation, and AI-assisted analysis are inputs to the map.
    They are not substitutes for understanding the system.
  questions:
    - "What does the business expect to happen?"
    - "What does the software actually do?"
    - "Where do those views agree, diverge, or remain unknown?"

evidence_intro:
  label: "Architecture Retrospectives"
  title: "Cornerstone Case Studies & Production Proof."
  text: >-
    Real-world architectural interventions from high-consequence financial and distributed platforms.
    Every case study details the structural problem, technical mechanism, and verified outcome.

evidence:
  - context: "Monolith Modernization"
    title: "System Cartography: Mapping a 10-Year Monolith"
    text: >-
      How we mapped 10 years of undocumented Rails dependencies, decoupled seven lending funnels,
      and created a living 4D architecture map without stalling active delivery.
    link_label: "Read Case Study"
    href: "/2026/08/29/system-cartography-how-to-map-a-ten-year-old-monolith.html"
  - context: "Database Engineering & Compliance"
    title: "Database Archaeology: Safe Multi-Table PII Purge Engine"
    text: >-
      Engineered a 5-phase zero-downtime deletion engine with strict lock-timeout budgets and WAL replication lag
      throttling across high-throughput PostgreSQL production clusters.
    link_label: "Read Case Study"
    href: "/2026/08/29/database-archaeology-safely-purging-sensitive-records.html"
  - context: "Enterprise Rails Resilience"
    title: "Hunting the 4% Defect: Rails Cookie Overflow & DynamoDB"
    text: >-
      Diagnosed and resolved a silent 4% customer application drop caused by session cookie bloat
      by engineering custom overflow middleware and migrating to DynamoDB session storage.
    link_label: "Read Case Study"
    href: "/2026/08/30/hunting-the-4-percent-defect-rails-cookie-overflow.html"
  - context: "Fintech State Machines"
    title: "Instant Money: Real-Time Debit Disbursement Architecture"
    text: >-
      Designed Speedfunds two-phase state verification gates and idempotent ledger webhooks to safely
      disburse funds in real time without uncommitted read risks.
    link_label: "Read Case Study"
    href: "/2026/08/30/instant-money-real-time-debit-disbursement-architecture.html"

