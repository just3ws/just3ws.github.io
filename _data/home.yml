hero:
  eyebrow: "Hands-on Director of Engineering"
  headline: "Hands-on engineering leadership for complex platforms and team transitions."
  lede: >-
    I’m a Director of Engineering who gets into the code, figures out how legacy
    systems actually work, and builds the team culture needed to modernize them safely.
  actions:
    - label: "Review my experience"
      href: "/"
      style: "primary"
    - label: "Review selected work"
      href: "/portfolio/"
