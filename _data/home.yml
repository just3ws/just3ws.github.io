public_record:
  title: "A public record of technical practice"
  text: >-
    Long before system cartography had a name, I was speaking, teaching,
    organizing, interviewing practitioners, and preserving how software people
    reason about their work. The archive remains here as evidence of that
    long-running practice—not as a substitute for my current focus.
  links:
    - label: "Technical writing"
      href: "/writing/"
    - label: "Conversation archive"
      href: "/interviews/"
    - label: "Archive intelligence"
      href: "/intelligence/"

