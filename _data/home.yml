through_line:
  title: "20+ years of technical leadership"
  text: >-
    Architecture, production debugging, observability, delivery, and team design
    are deeply connected when systems grow complex. I bridge the gap between business
    goals and underlying system behavior, helping engineering teams build a shared
    understanding of their platform and execute safely.

evidence:
  - context: "Platform Modernization"
    title: "Unraveling legacy systems"
    text: >-
      Mapping undocumented service dependencies, tracing code paths to database
      state, and safely upgrading infrastructure under live production traffic.
    link_label: "Review selected work"
    href: "/portfolio/"
  - context: "Engineering Leadership & Continuity"
    title: "Stepping in during transitions"
    text: >-
      Aligning distributed teams, establishing clear system ownership, setting up
      incident response rhythms, and building realistic delivery roadmaps.
    link_label: "Read executive resume"
    href: "/"
  - context: "Active Practice"
    title: "Still designing, building, testing, and shipping"
    text: >-
      Phalanx Duel is my active engineering laboratory: a tactical card game built
      around explicit state models, reproducible simulation, accessibility, and modern
      AI-assisted engineering discipline.
    link_label: "Review selected work"
    href: "/portfolio/#project-phalanx-duel"

