operating_pattern:
  label: "What I do"
  note: "A repeatable operating loop for making systems safe to change."
  steps:
    - name: "Stabilize"
      summary: "Find the immediate risks and make production safe enough to investigate."
    - name: "Understand"
      summary: "Trace the real workflow across code, data, infrastructure, and teams."
    - name: "Improve"
      summary: "Use the shared picture to plan and ship safer changes."

through_line:
  label: "What I do"
  title: "Make the next safe improvement visible."
  text: >-
    When no one person has the whole picture, delivery slows and risk hides in
    the gaps. I connect business goals, system behavior, evidence, and ownership
    so teams can decide together and move with confidence.

method:
  eyebrow: "Panoramic View"
  title: "Start with what the system actually does."
  lede: >-
    Panoramic View is my practical framework for legacy modernization: map the business process,
    trace what the software actually does across runtime boundaries, and resolve the differences before changing anything.
  actor_note: >-
    The user of the system might be a customer, an employee, an automated process, or
    an AI agent. The same questions apply.
  evidence_note: >-
    Logs, traces, diagrams, documentation, and AI-assisted analysis are inputs to the map.
    They are not substitutes for understanding the system.
  formula: "Inventory → Evaluate → Address"
  questions:
    - "What does the business expect to happen?"
    - "What does the software actually do?"
    - "Where do those views agree, diverge, or remain unknown?"

evidence_intro:
  label: "Architecture Retrospectives"
  title: "Proof that the work changes outcomes."
  text: >-
    Each case study starts with a problem people recognize, explains the useful
    intervention, and shows the outcome that made the next decision easier.

evidence:
  - context: "Monolith Modernization"
    title: "System Cartography: Mapping a 10-Year Monolith"
    problem: "A valuable Rails platform had a decade of undocumented dependencies and seven lending funnels that were difficult to trace."
    intervention: "Mapped the runtime and business paths, then gave squads a shared picture for making changes."
    result: "Teams could modernize without a rewrite or planned downtime."
    link_label: "Read Case Study"
    href: "/2026/08/29/system-cartography-how-to-map-a-ten-year-old-monolith.html"
  - context: "Database Engineering & Compliance"
    title: "Database Archaeology: Safe Multi-Table PII Purge Engine"
    problem: "Sensitive records were spread across legacy PostgreSQL tables with dependencies that were not safe to guess at."
    intervention: "Mapped the references and designed a five-phase deletion strategy with lock-timeout budgets and replication controls."
    result: "The team could remove data while protecting live application state."
    link_label: "Read Case Study"
    href: "/2026/08/29/database-archaeology-safely-purging-sensitive-records.html"
  - context: "Enterprise Rails Resilience"
    title: "Restoring a Hidden 4% of Customer Applications"
    problem: "Four percent of customer applications disappeared silently at the boundary between Rails sessions and downstream storage."
    intervention: "Followed the request path through oversized cookies, defensive middleware, and the DynamoDB migration."
    result: "Removed the hidden failure mode and restored the missing applications."
    link_label: "Read Case Study"
    href: "/2026/08/30/hunting-the-4-percent-defect-rails-cookie-overflow.html"
  - context: "Fintech State Machines"
    title: "Instant Money: Real-Time Debit Disbursement Architecture"
    problem: "Real-time disbursement had to coordinate transactional state without trusting uncommitted reads."
    intervention: "Designed two-phase state verification gates and idempotent ledger webhooks."
    result: "Funds could move quickly while the ledger remained consistent and replayable."
    link_label: "Read Case Study"
    href: "/2026/08/30/instant-money-real-time-debit-disbursement-architecture.html"

