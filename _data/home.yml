hero:
  headline: "I make complex software systems easier to understand and safer to change."
  lede: >-
    I work on architecture, production reliability, legacy modernization, and
    observability. I stay close to the code and help teams agree on what the system
    does, who owns it, and what to change next.
  actions:
    - label: "Read my résumé"
      href: "/"
      style: "primary"
    - label: "See selected work"
      href: "/portfolio/"
      style: "secondary"

operating_pattern:
  label: "How I work"
  steps:
    - name: "Stabilize"
      summary: "Find the immediate risks and make production safe enough to investigate."
    - name: "Understand"
      summary: "Trace the real workflow across code, data, infrastructure, and teams."
    - name: "Improve"
      summary: "Use the shared picture to plan and ship safer changes."

through_line:
  label: "What I do"
  title: "Technical leadership that stays close to the code."
  text: >-
    My best work starts when no one person has the whole picture. I trace failures end
    to end, clarify ownership, and turn what I learn into architecture and delivery
    decisions teams can use.

method:
  eyebrow: "Panoramic View"
  title: "Start with what the system actually does."
  lede: >-
    Panoramic View is my name for a practical way of working: map the business process,
    trace what the software actually does, and resolve the differences before changing
    anything.
  actor_note: >-
    The user of the system might be a customer, an employee, an automated process, or
    an AI agent. The same questions apply.
  evidence_note: >-
    Logs, traces, diagrams, documentation, and AI-assisted analysis are inputs to the map.
    They are not substitutes for understanding the system.
  questions:
    - "What does the business expect to happen?"
    - "What does the software actually do?"
    - "Where do those views agree, diverge, or remain unknown?"

evidence_intro:
  label: "Evidence"
  title: "Examples from real systems."
  text: >-
    These are the kinds of problems I have worked through in production. Public
    descriptions stay high-level where employer and client details are private.

