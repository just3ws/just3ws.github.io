turns:
- speaker: M1
  text: Open Settings and scroll to Card Signal Loadout. Each preview shows the card
    back your opponent will see. The card indicates whether the skin is equipped,
    available to equip, or locked. Read the unlock requirement directly beneath the
    preview.
- speaker: M1
  text: After completing your first match, return to Card Signal Loadout. Select Equip
    on Dual Loop and check that its status changes to Equipped.
