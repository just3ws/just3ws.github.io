  text: |-
    Before OpenTelemetry existed, what did Proto-Observability
    look like in a 2012 Rails app? Inside Chicago CodeCamp's codebase, bullet-wired in
    development are beta-catch-n-plus-1-SQL queries,
    hop-to-notifier for exception tracking before it became AirBreak,
    simple-cover-cover-feeding Hudson and Jenkins CI,
    and a secret question mark TSS equals one query parum that
    injected diagnostic CSS on demand. See the full technical tour in episode 4 on the playlist.
