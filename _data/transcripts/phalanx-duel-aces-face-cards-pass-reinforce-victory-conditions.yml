speaker_map:
  M1:
    name: Mike Hall
    role: Host, Phalanx Duel
turns:
- speaker: M1
  text: |-
    Welcome to the season 1 finale of Phalanx Duel. Today we
    cover the rules that separate beginners from tournament
    contenders, aces, face cards, passing, reinforcing, and
    victory conditions. Aces and face cards follow strict destruction eligibility
    rules, you can just brute force them with any attacker, so
    placing them in the right column can lock down an entire
    lane. When an attack would put you at a disadvantage, you can
    pass to preserve your formation, but watch the pass counter
    .
- speaker: M1
  text: |-
    Whenever a column opens up, the reinforce phase lets you
    slide back row defenders forward or deploy fresh units from
    your hand. A duel ends when a player reaches 0 life points, forfeits,
    or triggers the liveness rule. That wraps up season 1. In season 2, we'll sign up your
    account, unlock custom card backs, and customize your HUD.
