- speaker: M1
  text: |-
    Episode 2, What Chicago Code Camp Was Really About, The
    People, The Sponsors, and The Three-Year May Conference Rhythm
    Captured in 796 Commits
    Look at the commit cadence in Git and you can feel the
    heartbeat of a free, community-run Saturday conference, in
    2010, 175 commits from January to May, launching on Rails 2,
    3, 5 with GPLV2 locked in on April 7, in 2011, 489 commits,
    155 in February alone, rebuilding everything on Rails 3,
    and in 2012, 132 commits right up to May 15th, four days
    before doors opened at the College of Lake County in Brayslake,
    Illinois. Four contributors appear in Git History up to Prod 2012-05,
    Michael D. Hall with 764 commits, Sergio Pereira with 24,
    including two early 2010 commits from Windows where Git
    fell back to unknown,
    Adam Walters with 7, and Dustin Updike with 1, and right in
    the footer, Jane Ashley is credited for the three-ring dot
    logo. Free conferences don't run on air.
- speaker: M1
  text: |-
    The May 6, 2012 Internet Archive Capture preserves the 12
    sponsors who backed Chicago CodeCAM 2012, Microsoft at Platinum,
    Platinum Consulting Services at Gold, 8thLite, Centaur,
    Groupon, Logic NP Software, Telerik, ThoughtWorks, and Twilio
    at Silver, plus GitHub, JetBrains, and NewDesic at Bronze. And the speakers who gave up a Saturday to teach, 32
    speakers on the May, 2012, lineup covering, NET, Ruby, Clodger,
    Go, iOS, Java, Node.js, and Software Craftsmanship. Early 2010 speaker headshots in Git also preserved the
    memory of regional community builders, including Dave Bost,
    whose warmth and contributions we honor respectfully. Next in episode 3, the design that ruffled corporate
    feathers, triadic sass, lowercase headings, the dev mode
    color proof bar, and 2012 accessibility.
