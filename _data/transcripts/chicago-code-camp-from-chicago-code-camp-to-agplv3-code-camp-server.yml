- speaker: M1
  text: |-
    Episode 5, Carrying Chicago CodeCamp Forward, Preserving 16
    Years of Git History, Switching Main to GNU AGPL Version 3,
    and Charting the Rails 8 and Railway Roadmap for CodeCamp
    Server
    We didn't want to throw away the past or start a
    disconnected repo, so we tagged the last known good 2012
    production commit as Prod 2012, 05, archived the 2018
    master branches Archive Master 2018, preserved the 2025, 12
    Coley Mach Oracle untouched, and branched a fresh main
    directly from 2012 production
    From April, 2010 onward, CCS was licensed under GPL v2,
    because the intent was always a community-run, share-like
    conference server
    For a hosted web app, GPL leaves a network loophole, moving
    Main to GNU AGPL Version 3 closes that gap and honors the
    original spirit of contributing improvements back to the
    community
    With the static HTML mirror, 23 screenshots, and this
    series preserving the 2012 Chicago CodeCamp site
    permanently, the path forward is clean
    Port the 19-table schema and 17 models onto current Ruby
    and Rails 8 right inside Main, extract Chicago-specific
    settings into event configuration, and deploy a modern,
    reusable CodeCamp server on Railway
    Keeping the Coley Mach 2012 container beside us as the
    behavioral Oracle
    Thank you for walking down memory lane with Chicago CodeCamp
    Follow the code at GitHub Just3WSCCS and the companion
    series on Just3WS.com
