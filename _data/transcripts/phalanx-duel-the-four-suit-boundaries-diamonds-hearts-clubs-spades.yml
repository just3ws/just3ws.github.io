turns:
- speaker: M1
  text: |-
    In Phalanx Duel, suits are not global shields or heals,
    they are precision combat boundaries that fire only when
    damage crosses a specific step
    Diamonds defend the card to card boundary, absorbing damage
    before it spills into your back row
    Hearts guard the player boundary, softening damage right
    before it hits your life points
    Clubs and spades supercharge your offense, amplifying card
    to card breakthroughs and driving extra lethal damage
    across the column boundary
    Every single combat calculation is inspectable step by step
    in the HUD
    Next up in episode 5, Aces, Face Cards, Passing, and Rein
    forcing
