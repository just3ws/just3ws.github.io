  text: |-
    How does your ranking work in Phalanx Dual? Let us open the
    leaderboard and decode the ELO system. Ratings are tracked separately across four categories: PvP,
    SP Random, SP Heuristic, and SP MCTS, starting from a 1000
    ELO baseline with a K-factor of 32. As you play more rated games in a season, your confidence
    label progresses from provisional to calibrating to
    established or inactive if you step away for 30 days.
