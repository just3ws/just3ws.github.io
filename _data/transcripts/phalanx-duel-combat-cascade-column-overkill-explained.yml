speaker_map:
  M1:
    name: Mike Hall
    role: Host, Phalanx Duel
turns:
- speaker: M1
  text: |-
    How does damage actually flow in Phalanx Duel? It all comes
    down to the column cascade. Only front rank cards can
    attack, and they always strike straight across into the
    matching enemy column. When an attack destroys the enemy
    front card, leftover damage cascades straight into the back
    card behind it, destroy the back card too, and any
    remaining overkill hits the opponent's life points directly
    .
- speaker: M1
  text: |-
    And remember, in classic mode, surviving cards reset to
    full health between turns, so chip damage doesn't stick
    unless you break through. Watch episode 4 next for the F
    oursuit Boundaries.
