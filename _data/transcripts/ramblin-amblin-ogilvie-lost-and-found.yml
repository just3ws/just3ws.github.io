    text: "Fun little anecdote back when I was doing the UGtastic interviews full-on downtown. One day I happened to forget my bag, my camera, and my microphone. So the first version of the microphone I had, I left it on the Metra train, and then I proceeded to come to this lost and found every day for weeks. Just to say, have you seen the camouflage bag? Small duffel bag, approximately two feet long, and it had a tripod, a camera, a webcam, a microphone, and some cables."
  - speaker: M1
    text: "And people felt bad for me for a while. They checked every station, they checked every handoff, they talked to the conductors, and it was just gone. But yeah, I happen to be downtown and just wanted to stop here in the old Ogilvie lost and found and see if maybe anybody turned it in. It looks like they are closed, so no luck today. Good people, but nobody turned it in. All right, thanks, bye."
