turns:
- speaker: M1
  text: Deploy into the front rank and complete your formation. In Classic combat,
    compare attacker and defender ranks across each lane before you commit. When you
    need to keep your formation intact, open the command drawer and press Pass. Repeated
    passes can cost the match.
- speaker: M1
  text: Once a lane opens up, eligible reinforcement cards light up in your hand and
    mark the legal column. Choose a card from your hand and place it into the highlighted
    opening. The updated formation is visible immediately.
