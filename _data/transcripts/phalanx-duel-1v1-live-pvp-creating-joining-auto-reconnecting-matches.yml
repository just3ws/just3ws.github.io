turns:
- speaker: M1
  text: |-
    Playing live against another human is where Phalanx Duel
    truly shines. Let us walk through creating and joining a 1v
    1 match. Create a match from the lobby to get a one-click invite
    link, or browse open challenges in the public lobby. Once
    both players connect, the match transitions straight into
    deployment.
- speaker: M1
  text: |-
    If your browser refreshes or your Wi-Fi blips mid-Duel, the
    server persists every turn to PostgreSQL and automatically
    restores your exact board state when you reconnect.
