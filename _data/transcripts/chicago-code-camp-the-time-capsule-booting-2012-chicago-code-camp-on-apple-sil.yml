speaker_map:
  M1:
    name: Mike Hall
    role: Host, Chicago Code Camp → Code Camp Server
turns:
- speaker: M1
  text: |-
    14 years is an eternity in web software. This is episode 1
    of Chicago CodeCamp to CodeCamp server. Resurrecting the
    May, 2012, Rails 3 production app on Apple Silicon, and
    matching it one-to-one against the Internet Archive. The story starts in Git on January 23, 2010, with commit A8
    at 4B11.
- speaker: M1
  text: |-
    Across three consecutive May conferences and 796
    commits, CCS grew from a weekend Rails 2.3 site into a
    Rails 3.0.11 conference platform deployed on Heroku at
    checkagakataCamp.com. Its last 2012 commit, tagged prod 2012-05, landed on May 15,
    2012, four days before the camp. To see what it actually looked like without installing
    ancient rubies on macOS, we booted the 2025-12 Docker
    Oracle inside KoliMaha, on Apple Silicon, Ruby 1.9.3's 2009
    config gas didn't recognize ARM64, and FFI 1.0.11 needed Ubuntu
    14.04's system libfee. Two small Docker file fixes later, we brick on Ruby 1.9.3
    answered HTTP 200 on local has 3000.
- speaker: M1
  text: |-
    Complete with Jane
    Ashley's logo, lowercase headings, and the dev mode color-proof
    swatch bar. Place the local Kohli Mahout side-by-side with the Internet
    Archive's May 18, 2012 capture, taken one day before the
    conference, and it's a one-to-one match. The same maroon triadic gradient, the same navigation pills,
    and the same speaker login card, now filled with the real
    May, 2012, session lineup. Because the local dev database only holds seed rows, the
    Wayback Machine fills in the living history.
- speaker: M1
  text: Twelve sponsors on May 6, 2012. Microsoft at Platinum. Platinum Consulting
    Services at Gold. Eighthlight.
- speaker: M1
  text: Centaur. Groupon. Logic and P. Telerik.
- speaker: M1
  text: ThoughtWorks. And Twilio at Silver. Plus GitHub. JetBrains.
- speaker: M1
  text: |-
    And New Design at Bronze. And 32 speakers on the May, 2012 roster. Built by a community that showed up year after year. With contributions in Git from Mike Hall, Sergio Pereira,
    Adam Walters, and Dustin Updike,
    and early speaker archives preserving the memory of
    community friends including Dave Bust.
- speaker: M1
  text: |-
    We've anchored Prod 2012-05, archived the old master branch,
    and moved main to GNU AGPL version 3. Next in episode 2, we dig into the design ethos, active
    admin, feature flags,
    and the proto-observability already baked into this 2012
    codebase. Check the companion series on just3ws.com.
