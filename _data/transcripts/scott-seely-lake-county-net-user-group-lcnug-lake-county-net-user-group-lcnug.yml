- speaker: M1
  text: Yeah, it sounds like a real title.
- speaker: S1
  text: Oh yeah, it sounds real.
- speaker: M1
  text: It is a real title, it's just that it's not paid.
- speaker: S1
  text: It's not a descriptive title.
- speaker: M1
  text: Yeah, yeah, it's like--
- speaker: S1
  text: I'm neither a director at Microsoft, nor do I have a region. Typically, what
