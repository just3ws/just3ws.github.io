turns:
- speaker: M1
  text: Hi, I'm Mike Hall. I'm sitting down here with Scott Seely, who runs the Lake
    County .NET user group, and he's a Microsoft Regional Director. So he's very involved
    with the community in the Midwest region. So Scott, can you tell me a little bit
    about Lake County .NET user group, why you founded it, and as Regional Director,
    what have you kind of experienced with the user group community in and around Chicago,
    or actually, what region do you cover?
- speaker: S1
  text: Okay, so first off, Lake County .NET user group was founded by myself and another
    gentleman named Tim Stahl. Tim and I both saw the need to have a user group in
    the northern burbs just because of the fact that the Chicago area, due to the traffic
    and the way that everybody's kind of spread out, people don't like driving more
    than 40 minutes from home.
- speaker: M1
  text: Right.
- speaker: S1
  text: Because of that, you wind up with user groups, some in Chicago, some in the
    north, some out in the western burbs. I don't know of any down in the southern
    burbs, obviously, but that's what wound up happening, so Tim and I both live north
    of Chicago and wanted something closer to home than going to Downers Grove for
    our .NET user group meetings. So that's why we founded the group, was pretty much,
    we didn't like driving.
- speaker: M1
  text: Right.
- speaker: S1
  text: And we wanted to, and we like going to user group meetings. Right now, Lake
    County, we've got a, we have attendees, so our mailing list, I guess, is the best
    way to measure that, and about 500 different people have shown interest at one
    point or another, so that's about how many people we notify every time that we
    have a meeting. On average, we get about 20 to 40 people, typically closer to the
    20 side, for when folks show up.
- speaker: M1
  text: And typically, the same people coming back, or do you get new blood coming
    in, how is that?
- speaker: S1
  text: It seems that we have, like, you'll go on streaks where you'll have five or
    six people who will be there several months in a row, and then it just kind of
    turns over. We have some folks who've been going pretty regularly for the past
    several years, and that makeup just changes. You have people who, that's part of
    the regular schedule for a while, then they get a new contract somewhere else,
    they go elsewhere, and then when that contract ends, they're closer to home, they
    also start showing up again.
- speaker: M1
  text: Oh, okay. So, they're regulars, but just life, sometimes.
- speaker: S1
  text: Life happens, yeah. As far as the Regional Director thing goes, that's just
