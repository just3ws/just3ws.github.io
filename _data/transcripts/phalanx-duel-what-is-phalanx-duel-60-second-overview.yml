turns:
- speaker: M1
  text: |-
    Welcome to Phalanx Duel, a deterministic tactical card game
    where every move is verifiable and formation is everything
    Hit quick start from the lobby to jump straight into a live
    match against a training bot
    Each player commands a 2x4 battlefield, a front rank that
    attacks, a back rank that reinforces, and a life points
    pool
    Drop your opponent to 0 life points to win
    Deploy your opening cards into columns, trigger suit
    boundaries, and break through to the enemy life points
    Check the playlist for Episode 2 on Formation Strategy.
