- speaker: M1
  text: Hi, it's Mike with UGtastic. I'm here again at Groupon, and I'm sitting here
    with Trek Glowacki, who co-organizes the Chicago Ember.js, but is also a member
    of the Ember.js Core Team. Thank you very much for taking the time to talk to
    me. So, Ember.js, right now we're in kind of a whole bunch of client-side frameworks,
    and Ember is one of the big ones. What got you into Ember so much that you became
    part of the Core Team?
- speaker: S1
  text: That's a good question. Back in, I started programming in Rails, sort of serious
    development in Rails like a lot of people did, and I was doing mostly client work.
    And I got to the point that my clients, the expectations they had about what a
    web application could do sort of get higher and higher, thanks to things like
    Facebook and Gmail. And they started demanding sort of higher levels of interactivity
    and reactivity than a server-generated app can generate. And so at the time, like
    many people, I was searching for a framework, but also realizing the stuff out
    there wasn't very good and working on a framework. And this was around the time
    that a previous framework called SproutCore had been forked to sort of adopt more
    of web standards. And I was basically trolling Yehuda Katz on the internet, saying
    like, this is awful, why isn't this done yet? And his pitch was like, you know,
    this has been a work in progress for multiple years, and this is how far we are.
    If you can think of any other project that has started, go work on that. But it's
    a hard project, and we're the ones making the progress. And I was like, you're
    right, so I have to go help, because I've tried to do this myself.
- speaker: M1
  text: He called you out.
- speaker: S1
  text: He called me out. He was like, stop complaining and start helping. And at
    that time, one of the major drawbacks of all the frameworks were there's just
    no documentation about how to use any of them. So I just cracked my laptop and
    started with the first file alphabetically, opened it up, read through the code,
    figured out what it did, and wrote the documentation for it. And I sort of did
    that throughout the entire framework and in doing so, basically taught myself
    how the whole system worked.
- speaker: M1
  text: Yeah, documentation is very difficult. Most people aren't very good at it.
- speaker: S1
  text: 'Yeah, it''s tough. You need someone who is both a skilled developer to sort
    of dive in and understand the nuances of the architecture, but also is an articulate
    writer. Having both of those skills is sort of complicated. I have two degrees:
    an undergrad in English literature and a master''s degree in human-computer interaction.
    So I think the two of those combined is kind of like an ideal person to go around
    and being like, how does this work? And if the answer is nobody knows, to tell
    the world how it works.'
- speaker: M1
  text: Yeah. And so you started doing this documentation. How does that transition
    from being a contributor to being a member of the team?
- speaker: S1
  text: So at the time we didn't have like an official core team. It was just a free-for-all
    of people contributing however they felt they could best help. And I was doing
    a lot of contributions, both code and documentation. And then before the first
    ever conference, March of two years ago, a lot of the heavy contributors were
    sitting in a room and it was like, this should be our core team. These would be
    the people that sort of guide the framework moving forward. So it was kind of
    just who's here, who's contributing, who doesn't seem like a total bozo. Because
    in any open source project or any project in general, you get people who are heavy
    committers, but sort of have a weird notion about how things should be done either
    because of a strange perspective or limited experience. So there's the combination
    of like, who's committing heavily and who seems like they're not going to commit
    craziness into the codebase.
- speaker: M1
  text: Yeah. So there's trust.
- speaker: S1
  text: Yep. A lot of trust involved.
- speaker: M1
  text: So you're involved in Ember. Now you're running a user group. How did that
