    doing my full-time job here at Groupon, doing UI development, and then all my
    open source contributions. In a lot of ways, it's like I work two full-time jobs.
    And then someone was like, we should do a meetup. And I'm like, yes, you should
    do a meetup, and I'd be happy to attend. So he started doing those and also had
    limited time. So there were just a lot of mess ups in scheduling times and getting
    speakers. So I think we scheduled once in September of two years ago and then
    failed to actually hold the event like four or five times in a row. And then in
    January, he was just like, I can't do this anymore. And I was like, I guess it's
    my responsibility now.
- speaker: M1
  text: Yeah. So you didn't let it die.
- speaker: S1
  text: I did not let it die, no.
- speaker: M1
  text: So you learned a lot. Did it change the way you interact with the community?
    I mean, before, mostly you were online communicating with people. Now you're actually
    meeting in meatspace with people.
- speaker: S1
  text: Yeah. I mean, I learned a lot about both who's using Ember and sort of what
    difficulties they have, which definitely informs where public APIs need to be
    nicer. But I also learned a lot about running a user group. I think there's this
    perception that a lot of people have that it's not that hard to put one together.
    Or sometimes people want to charge for user groups, like five, ten bucks, and
    people understand like, why would you charge? They should be free. That understanding
