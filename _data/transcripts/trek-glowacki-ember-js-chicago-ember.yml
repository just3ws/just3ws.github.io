- speaker: S1
  text: Yeah. If I were billing at my hourly rate for a meetup, it would have to be
    really... no one could afford it.
- speaker: M1
  text: Has it overall been a positive experience? Has it been enjoyable?
- speaker: S1
  text: Yeah, I think it's super fun. I'm always excited to see the ways people are
    using Ember. Back when we started fairly early on, we were very heavily pushing
    for like Ember.js is for apps. It's not just a view layer, like Angular or React
    is. I mean, I think the React guys are basically like, we're kind of a replacement
    for jQuery, we're not a full application framework. And Ember is a full application
    framework. And we kept getting people doing presentations of like, I built this
    content site in Ember, or like my HTML and CSS person doesn't know a lot of JavaScript,
    he uses it as a rapid prototyping tool, which was just like, oh, I never would
    have thought people would use it that way. We're very focused on the application
    case. But it turns out when you end up with a meaningful set of primitives, you
    can compose them in all sorts of useful ways.
- speaker: M1
