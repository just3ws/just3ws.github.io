turns:
- speaker: M1
  text: |-
    In episode 2 of Phalanx Duel, we break down the most
    important phase of the game, formation-first deployment. Let's jump into a training match and look closely at how
    your opening hand becomes your battlefield. Your hand and draw pile stay hidden, but every card you
    deploy onto the 2x4 battlefield is face-up in public. That means both players can read every column and calculate
    exact combat math.
- speaker: M1
  text: |-
    Click a card in your hand and choose a column slot. Cards in the front rank lead your attacks and absorb
    incoming fire first. Cards in the back rank protect your life points and advance
    forward when the front card falls. When you want faster games or tournament warm-ups, quick
    deploy fills your formation automatically.
- speaker: M1
  text: |-
    But manual deployment lets you line up suit boundaries and
    protect key back row anchors. Up next in episode 3, Combat Cascade and Column Overkill.
