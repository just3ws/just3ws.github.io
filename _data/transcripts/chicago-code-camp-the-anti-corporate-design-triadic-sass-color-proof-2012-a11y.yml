- speaker: M1
  text: |-
    Episode 3, The Design Ethos of Chicago Code Camp 2012,
    intentionally creative, deliberately non-corporate, and
    built with an early living style guide right inside the app. In app style sheets color sass, the entire site is driven
    by a hand-tuned color triad. Maroon number 800000 is the
    primary gradient backdrop. Paired with minus 120 degree
    blue number 004080 and plus 120 degree green number 00803F,
    each stepped into 33 and 66% tints, written in indented sass,
    not SCSS, with lowercase headings across H1 through H5,
    open sans from Google web fonts,
    and asymmetric rounded cards.
- speaker: M1
  text: |-
    Run the app in development
    mode and you see something corporate templates never had. Shared color proof renders the entire triadic swatch bar
    right below the footer, so you can eyeball color harmony
    live in the browser, add question mark dss equals one to
    any URL, and application helper injects diagnostic CSS on
    demand. This was 2012, before Rails 3.1 sprockets asset pipeline,
    JavaScript lived in public JavaScript, loaded via
    JavaScript expansions defaults, jQuery replacing prototype,
    jQuery validate, jQuery placeholder, and modernizer for
    HTML5 feature detection,
    and IE6 and IE7 still mattered enough to load formtastic IE6
    CSS, formtastic IE7 CSS, and HTML5 SHIV from Google code. Accessibility in 2012 lived in formtastic semantic fields
    set, legend, and label tags, visible here on the call for
    papers form, inside a priori layout of header, content,
    sidebar, and footer divs.
