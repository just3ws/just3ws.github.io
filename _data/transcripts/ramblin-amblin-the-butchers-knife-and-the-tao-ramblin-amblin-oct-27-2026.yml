    From the Parables of Huang Se, The Butcher's Knife
    Prince Huey's cook was cutting up a bullock. Every blow of his hand, every heave of his shoulders,
    every tread of his foot, every thrust of his knee,
    every wish of rent flesh, every chick of the chopper
    was in perfect rhythm, like the dance of the mulberry grove
    ,
    like the harmonious chords of Qing Xiao. Well done, cried the prince. Yours is skill indeed.
- speaker: M1
  text: |-
    Sire, replied the cook, laying down his chopper,
    I have always devoted myself to the Tao,
    which is higher than mere skill. When I first began to cut up bullocks,
    I saw before me whole bullocks. After three years' practice,
    I saw no more whole animals,
    and now I work with my mind and not with my eye. My mind works along without the control of the senses.
- speaker: M1
  text: |-
    Falling back upon eternal principles,
    I glide through such great joints or cavities as there may
    be,
    according to the natural constitution of the animal. I do not even attempt to cut through large bones. A good cook changes his chopper once a year because he cuts
    ,
    an ordinary cook once a month because he hacks. But I had this chopper nineteen years,
    and although I have cut up many thousand bullocks,
    its edge is as if fresh from the whetstone.
- speaker: M1
  text: |-
    For, at the joint, there are always interstices. And the edge of a chopper, being without thickness,
    it remains only to insert that which is without thickness
    into such an interstice. Indeed, there is plenty of room for the blade to move about
    . It is thus that I have kept my chopper for nineteen years,
    as though fresh from the whetstone.
- speaker: M1
  text: |-
    Nevertheless, when I come upon a knotty part
