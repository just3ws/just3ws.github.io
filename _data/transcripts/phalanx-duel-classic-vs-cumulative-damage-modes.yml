- speaker: M1
  text: |-
    Two damage modes completely change how you build columns in
    Phalanx Duel, Classic and Cumulative
    In Classic mode, any card that survives an attack heals
    back to full strength at the end of the turn, rewarding
    decisive breakthroughs
    In Cumulative mode, damage sticks across turns so attrition
    and multi-turn focus fire can grind down even the toughest
    front rank
    Try both in custom match options
