turns:
- speaker: M1
  text: |-
    Ever wonder why a Chicago Rails conference app from 2012
    named its talk model Sessia? In Ruby on Rails, Session is already reserved for HTTP Session
    State. Instead of fighting the framework, Chicago CodeCamp named
    the active record model Sessia,
    Polish for Session, and routed it publicly at Slash Sessions. Clean URLs for attendees, zero naming collisions in Rails 3.
