# Multi-tiered resume configurations spanning contract execution to enterprise IC leadership.

staff_systems_architect:
  id: staff_systems_architect
  file_slug: mike-hall-staff-systems-architect
  short_label: "Staff Systems"
  title: "Staff Software Engineer / Systems Architect"
  target_tier: "Staff IC / Systems Architecture / Legacy Modernization"
  identity_lens: "Shows how I see system boundaries, sequence high-risk change, and protect production systems."
  evidence_path: "/case-studies/"
  summary: >-
    Staff Software Engineer specializing in high-consequence legacy modernization, distributed systems architecture, and platform resilience. Combines hands-on software engineering with platform architecture, OpenTelemetry distributed tracing, cross-lane boundary mediation, and zero-downtime data migrations across Ruby on Rails, PostgreSQL, TypeScript, and cloud infrastructure.
  core_skills:
    - Platform Architecture & Legacy Modernization
    - Cross-Domain Boundary Architecture & Governance
    - OpenTelemetry & Distributed Trace Context Propagation
    - High-Consequence Incident Escalation & Root Cause Analysis
    - Zero-Downtime Data Migrations & Schema Partitioning
    - Ruby on Rails, PostgreSQL, pgvector, Sidekiq, Solid Queue & Redis
    - TypeScript, Node.js, C#, .NET, Java & SQL
    - AWS, Docker, Kubernetes & CI/CD Pipelines
    - Privacy-Conscious Local AI Orchestration & RAG Tooling
  featured_positions:
    - id: just3ws
      focus: >-
        Architected and operating sovereign production platforms across Ruby on Rails 8, PostgreSQL 18 (pgvector), Solid Queue, TypeScript, and local Metal GPU AI inference runtimes, combining autonomous media pipelines, deterministic 5-stage FFmpeg audio DSP restoration (dehum), hybrid vector/lexical search, deterministic state engines (Phalanx Duel), and multi-source ingestion with prompt-injection guardrails (WWWorkRemote).
    - id: onemain
      focus: >-
        Led modernization of the Acquisition Lane, the digital front door for customer application and origination funnel workflows, delivered an instant disbursement workflow, applied Architecture Discovery to a silent application-completion defect, and aligned distributed observability with SRE operations.
    - id: sk-holdings
      focus: >-
        Modernized search and asynchronous messaging pipelines under live production load, executing zero-downtime Rails framework upgrades and database relational indexing.
    - id: activecampaign
      focus: >-
        Improved testability and performance inside a tightly coupled PHP/MySQL CRM backend, introducing structured query patterns and cache strategies, and hardening the Ember.js frontend test suite across core contact management workflows.
    - id: benchprep
      focus: >-
        Owned enterprise assessment workflows, optimizing complex PostgreSQL scoring calculations and implementing JWT cryptographic payload verification across embedded client APIs.
    - id: reachlocal
      focus: >-
        Architected a phased Strangler-Fig modernization roadmap and internal API Gateway with token authentication for a high-volume digital marketing platform.
    - id: groupon
      focus: >-
        Implemented a centralized merchant taxonomy service in Java and MySQL, engineered analytical fraud detection in Vertica, and led global technical onboarding curricula during hyper-growth.
    - id: obtiva
      focus: >-
        Delivered backend systems and data-driven architectures as a consultant for Sears, Leapfrog Online, and Groupon during extreme user growth.
  additional_experience:
    - id: tandem
    - id: klobomedia
    - id: coderwall
    - id: upcity
    - id: viewpoints
    - id: bdi
    - id: jpmc
    - id: brightstar
    - id: ticketsnow
    - id: bp
    - id: motorola

