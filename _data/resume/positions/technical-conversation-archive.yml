highlights:
  - text: >
      Autonomous Media Pipeline & Hybrid Search: Architected a Rails 8, Solid Queue, and
      PostgreSQL 18 (pgvector) microservice that ingests raw recordings, runs on-device
      Whisper transcription and speaker diarization, indexes 768-dimensional embeddings
      for hybrid RRF search, and orchestrates YouTube publishing with zero disk waste.

  - text: >
      Local-Only AI Restoration Pipeline: Built a Whisper and local-LLM pipeline that
      transcribes, diarizes, and structures long-form interview audio entirely on-device,
      keeping a large private media corpus off third-party inference services.

  - text: >
      Schema-Validated Content Platform: Built a contract-validated data layer where every
      interview, asset, and transcript is checked against an explicit schema at build time,
      with referential-integrity checks that fail the build rather than publishing broken data.

  - text: >
      Semantic Cross-Linking & Taxonomy Generation: Engineered a topic taxonomy, knowledge
      graph, and semantic cross-links across the corpus, turning an unstructured media archive
      into navigable, individually indexed pages.

  - text: >
      Primary-Source Capture & Digital Archaeology: Conducted the original interviews on-site
      at GOTO Conference, Software Craftsmanship North America, RailsConf, and WindyCityRails
      with practitioners including Dave Thomas, Stuart Halloway, Corey Haines, Sandro Mancuso,
      and Micah Martin, and recovered archival recordings across defunct platforms.

