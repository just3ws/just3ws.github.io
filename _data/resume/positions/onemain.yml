    Over years of rapid business expansion, high-volume financial customer loan application and origination flows
    accumulated implicit lateral state dependencies across multi-service Rails state machines, MuleSoft APIs, and
    IBM mainframe backends. A persistent, dark failure mode silently corrupted state and dropped 4% of applications
    during late-stage document preparation and e-signing.
  cartography_approach:
    - dimension: "Interaction Surface"
