title: Leadership Profile
text: >-
  Hands-on Director of Engineering who brings clarity to complex systems, builds
  capable engineering teams, and delivers safe platform modernization. Combines
  deep technical diagnosis and architecture with practical team leadership across
  regulated enterprise environments, high-growth products, and legacy systems under
  load. Builds shared operating models that help engineering teams move from isolated
  silos toward collective ownership, leveraging modern AI tooling to accelerate
  research and delivery without sacrificing engineering rigor.
