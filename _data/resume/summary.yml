---
title: Technical Leadership Profile
text: >-
  Principal software engineer who stabilizes complex production systems, leads
  architecture and modernization, and turns incomplete system knowledge into safe,
  executable change. Works
  across Ruby on Rails, PostgreSQL, distributed services, cloud infrastructure,
  and delivery systems, with deep experience in regulated and legacy environments.
  Leads through technical evidence: tracing failures end to end, resolving data
  integrity and reliability risks, establishing observability standards, and
  aligning multiple teams around clear ownership. Uses AI and automation to expand
  investigative and delivery capacity while keeping security constraints, source
  evidence, automated checks, and human judgment explicit.
