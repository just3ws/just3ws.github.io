---
title: Leadership Profile
text: >-
  Hands-on Director of Engineering who makes complex systems understandable,
  engineering teams more capable, and consequential change safer to deliver.
  Leads stabilization and modernization across regulated enterprise platforms,
  growing products, and founder-dependent legacy systems while remaining close
  to architecture, production diagnosis, data, and delivery. Created Panoramic
  View, an evidence-led system-cartography method that connects actor journeys
  and business decisions to code paths, infrastructure, data changes, ownership,
  and uncertainty. Builds shared operating models that help distributed teams
  move from isolated expertise toward collective ownership, using AI-assisted
  workflows to accelerate evidence gathering without outsourcing judgment.
