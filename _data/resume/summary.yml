title: Staff Software Engineering for Calm, Safe Change
text: >-
  I am a Staff Software Engineer who makes complex production systems easier to understand,
  safer to change, and easier for teams to own. I start by learning how people and business
  workflows use a system, then connect hands-on engineering to reliable outcomes. I coach
  engineers, make difficult technical ideas approachable, and build communities where knowledge
  can travel beyond one team. My work includes engineering onboarding at Groupon, Geekfest@OMF,
  OpenTelemetry leadership, leading Coderwall's open-source transition at Assembly, and preserving
  more than 200 interviews through UGtastic and WHOIS Tech Community.
