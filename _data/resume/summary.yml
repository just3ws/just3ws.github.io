title: Staff Software Engineering for Calm, Safe Change
text: >-
  I am a Staff Software Engineer who helps engineering teams modernize critical production
  platforms with confidence, clarity, and ease. Working alongside individual contributors,
  engineering managers, and product partners, I turn complex business goals into gradual,
  reversible technical steps. My focus is lowering operational stress, removing hidden failure
  modes, and fostering the psychological and technical safety teams need to build their best
  work and succeed together.
