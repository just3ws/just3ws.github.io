  - id: "uglst-decentralized-directory"
    year: "2014"
    date_display: "2014"
    era: "zero-dollar"
    title: "UGl.st: The Open User-Group Directory Before Centralized Silos"
    resume_anchor: "reachlocal"
    location: "Global Web Rails"
    communities:
      - "UGl.st"
      - "UGtastic"
    unsung_heroes:
      - name: "Grassroots Meetup Organizers Globally"
        role: "Local Community Stewards"
        note: "The hundreds of organizers listed on UGl.st running independent monthly meetings without ad trackers or platform rent-seeking."
    narrative: >
      Seeing how proprietary platform algorithms, paywalls, and spam were threatening independent community discoverability, Mike built UGl.st (The User-Group List). Designed as a lightweight, open static directory, it emphasized verified location data, cadence, and direct organizer contacts rather than engagement metrics.
    primary_sources:
