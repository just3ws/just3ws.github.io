      While hundreds of user groups flickered out or were absorbed by corporate marketing machines, SCMC persisted continuously for over 17 years. Meeting monthly at Follett Software Company, the group maintained an open, vendor-neutral table for polyglot katas, architecture retrospectives, and practitioner keynotes.
