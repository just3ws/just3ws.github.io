    source_album: "Last Obtiva Geekfest"

  - id: weird-al-and-emo-phillips
    date_sort: "2018-04-09"
    date_display: "April 9, 2018"
    date_evidence: "Date in the original photo filenames and album title."
    era: life-outside-work
    kind: personal
    title: "Weird Al, Emo Phillips, and a signed record"
    location: "Milwaukee, Wisconsin"
    location_evidence: "Google Photos album title."
    narrative: >-
      I went to see Weird Al and Emo Phillips, then met Weird Al and got a record
      signed. The concert photographs capture the noise and color of the night;
      the signed record is a memory I carry from the meet-and-greet, not an
      object shown in this photo.
    photo:
      path: "/assets/images/lived-history/weird-al-milwaukee-2018.jpg"
      alt: "Weird Al Yankovic performing under the lights at a Milwaukee concert."
    source: "Mike's Google Photos album and personal recollection; the selected photo shows the concert, not the meet-and-greet."
    source_album: "Weird Al Milwaukee April 9th, 2018"

  - id: corey-haines-sticker-laptop
    date_sort: "2012-10-05"
    date_display: "October 5, 2012"
    date_evidence: "Date in the original photo filename; the selected web copy has metadata removed."
    era: community-rooms
    kind: community
    title: "Corey Haines shows off his laptop stickers"
    narrative: >-
      I caught Corey Haines showing off the stickers on his laptop. These little
      bits of personality travelled from meetup to meetup alongside the ideas
      people came to share. I have not established the venue from the album, so
      I am leaving it unnamed.
    photo:
      path: "/assets/images/lived-history/corey-haines-laptop-stickers-2012.jpg"
      alt: "Corey Haines holds up a laptop covered in stickers."
    source: "Mike's Google Photos album and identification of Corey Haines; date is from the original filename."
    source_album: "Photos-1-001 (3)"

  - id: chicago-user-groups-presentation-2012
    date_sort: "2012-09-25"
    date_display: "September 25, 2012"
    date_evidence: "Date in the original photo filenames; the selected web copies have metadata removed."
    era: community-rooms
    kind: community
    title: "A Ruby presentation and an “I ♥ User-Groups!” sticker"
    narrative: >-
      I photographed a Ruby presentation and a community member showing off an
      “I ♥ User-Groups!” sticker on a laptop. I like having both moments from
      the same evening: the technical work people brought to the room, and the
      pride they took in the communities around it. The album does not establish
      the venue, so I have left it unnamed.
    communities: ["Ruby", "User groups"]
    photos:
      - path: "/assets/images/lived-history/ruby-presentation-2012.jpg"
        alt: "A presenter works through Ruby code projected on a screen during an evening meetup."
      - path: "/assets/images/lived-history/i-love-user-groups-sticker-2012.jpg"
        alt: "A community member holds up a laptop bearing an “I love User-Groups!” sticker."
    source: "Mike's Google Photos album and recollection of the sticker; dates are from the original filenames."
    source_album: "Photos-1-001 (4)"

  - id: chicago-woodpecker-rescue
    date_sort: "2018-04-16"
    date_display: "April 16, 2018"
    date_evidence: "Date in the original photo filenames and album title."
    era: life-outside-work
    kind: personal
    title: "The woodpecker on the way to a job interview"
    location: "Chicago, Illinois"
    location_evidence: "Mike's recollection; the album title identifies the day, not the place."
    narrative: >-
      I was heading to a job interview when I found a woodpecker on the sidewalk.
      I contacted a Chicago bird rescue, and they came to recover it before I
      went in. They ended up passing on me. I got the sense they were not
      charmed that I had stopped to help the bird. It was a very strange day in the city, and the
      woodpecker got the better story.
    photo:
      path: "/assets/images/lived-history/woodpecker-rescue-2018.jpg"
      alt: "A woodpecker rests in Mike's hands before the bird rescue collected it."
    source: "Mike's Google Photos album and personal recollection."
    source_album: "Operation Woodpecker Awake - 2018-04-16"

  - id: cantigny-sfor-brcko
    date_sort: "2020-03-07"
    date_display: "March 7, 2020 · Cantigny Park"
    date_evidence: "Date in the original image filename; the public derivative has metadata removed."
    era: life-outside-work
    kind: personal-history
    title: "Revisiting the Bosnia deployment through Brčko"
    location: "Cantigny Park, Illinois"
    location_evidence: "Mike's recollection and the Google Photos album context."
    narrative: >-
      At Cantigny Park, I photographed a First Division Museum exhibit about
      the Bosnia and Herzegovina conflict and the Brčko area. It brought me
      back to my own Bosnia deployment with SFOR. The photograph here shows
      the museum exhibit that made the connection for me.
    photos:
      - path: "/assets/images/lived-history/cantigny-sfor-exhibit-2020.jpg"
        alt: "NATO and SFOR flags on display at the First Division Museum in Cantigny Park."
      - path: "/assets/images/lived-history/cantigny-brcko-map-2020.jpg"
        alt: "A marked museum map with Brčko and Tuzla visible in Bosnia and Herzegovina."
    source: "Mike's Google Photos album and personal recollection; the visit date is from the original filename."
    source_album: "SFOR"

  - id: open-tech-talks-geekfest-omf
    date_sort: "2022-06-15"
    date_display: "June 2022–February 2024"
    date_evidence: "OneMain Financial role record and public retrospective."
    era: internal-community
    kind: teaching
    title: "Making a learning room inside a large organization"
    location: "OneMain Financial · internal community"
    narrative: >-
      I started Open Tech Talks and grew it into Geekfest@OMF, carrying forward
      the weekly peer-learning format I had experienced at Obtiva. Across more
      than 49 sessions, we worked through Ruby, legacy code, SOLID, Cynefin,
      early LLMs, and OpenTelemetry. I coached first-time speakers and made
      space for engineers from different teams to teach one another. I am
      keeping the workplace photographs private while I review them for
      colleagues' privacy and internal material.
    communities: ["Geekfest@OMF"]
    source: "Existing public OneMain role record and retrospective; no private workplace photo is published here."
    link:
      label: "OneMain role and public summary"
      url: "/resume/positions/onemain-financial/"

  - id: phalanx-duel-notebook-origin
    date_sort: "2022-07-10"
    date_display: "July 10, 2022 · The notebook and pen behind Phalanx Duel"
    date_evidence: "Capture date in the original photo filename; it documents the notebook and pen, not necessarily the first day of game design."
    era: internal-community
    kind: personal
    title: "A game starts as notes on paper"
    location: "Location not established"
    narrative: >-
      Before Phalanx Duel became a game, it lived in notebooks and on cards.
      This is one of the original notebooks and the pen I used while working
      out the ideas. I like having a picture of the workbench before it became
      a product.
    photo:
      path: "/assets/images/lived-history/phalanx-notebook-origin.jpg"
      alt: "A notebook, playing cards, and the pen Mike used while developing Phalanx Duel."
    source: "Mike's Google Photos album and recollection; the capture date comes from the original filename."
    source_album: "Photos-1-001 (8)"

  - id: carolina-waterfowl-rescue
    date_sort: "2022-04-27"
    date_display: "April 27, 2022"
    date_evidence: "Date in the original photo filename."
    era: internal-community
    kind: personal
    title: "A parking-garage rescue and a safe handoff"
    location: "Carolina Waterfowl Rescue; the parking garage location is not established"
    location_evidence: "The photographed sign identifies Carolina Waterfowl Rescue; Mike recalls finding the bird in a parking garage and driving it to the sanctuary."
    narrative: >-
      I found a young bird in a parking garage, got it safely into my car, and
      drove it to a sanctuary where they took it in. I had remembered the place
      generally as a Carolina bird rescue; the sign in my photo identifies it
      as Carolina Waterfowl Rescue. I am glad the bird made it to people who
      could care for it.
    photo:
      path: "/assets/images/lived-history/carolina-waterfowl-rescue.jpg"
      alt: "A small rescued bird being held during its handoff to a wildlife rescue."
    source: "Mike's Google Photos album and recollection; the organization name is read from the sign in a separate source photo."
    source_album: "Photos-1-001 (9)"

  - id: toad-and-salamander-rescue
    date_sort: "2022-07-09"
    date_display: "July 9 and August 21, 2022"
    date_evidence: "Dates in the original photo filenames; the photos show separate encounters."
    era: internal-community
    kind: personal
    title: "A toad, a salamander, and a pause in the day"
    location: "A skateboarding park and a separate outdoor spot; exact locations not established"
    narrative: >-
      I found a beautiful toad, then later came across a salamander at a
      skateboarding park and moved it out of danger. They were small encounters,
      but the photos bring back how much life is moving around us when we stop
      long enough to notice.
    photos:
      - path: "/assets/images/lived-history/toad-skate-park-2022.jpg"
        alt: "A small toad looking toward the camera from the dirt."
      - path: "/assets/images/lived-history/salamander-rescue-2022.jpg"
        alt: "A salamander resting in Mike's hand after being moved away from danger at a skateboarding park."
    source: "Mike's Google Photos album and recollection; the capture dates are in the original filenames."
    source_album: "Photos-1-001 (8)"

