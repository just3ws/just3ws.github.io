  - id: otel-working-group-handoff
    date_sort: "2024-04-01"
    date_display: "April 2024–September 12, 2025"
    date_evidence: "OneMain Financial role record and public retrospective."
    era: internal-community
    kind: community
    title: "Geekfest@OMF becomes the OpenTelemetry Working Group"
    location: "OneMain Financial · internal community"
    narrative: >-
      I founded and led the OpenTelemetry Working Group, turning a recurring
      learning community into a place to align teams around shared tracing and
      observability practices. The group reached 122 invited members. I handed
      it off when the organization could staff observability as a dedicated
      capability. This is the public summary; the internal album is not used
      as a photo source on this page.
    communities: ["Geekfest@OMF", "OpenTelemetry Working Group"]
    source: "Existing public OneMain role record and retrospective."
    link:
      label: "OneMain role and public summary"
      url: "/resume/positions/onemain-financial/"

  - id: chicagoruby-2026
    date_sort: "2026-09-09"
    date_display: "September 9, 2026"
    date_evidence: "Date in the original photo filenames and album title."
    era: current-practice
    kind: community
    title: "Still showing up for Chicago Ruby"
    location: "Chicago area; exact venue not established by the album"
    location_evidence: "Album title and event context."
    narrative: >-
      The rooms keep changing, and the reason to show up still feels familiar:
      share what we are learning, make space for good questions, and leave with
      a few ideas to try.
    communities: ["ChicagoRuby"]
    photo:
      path: "/assets/images/lived-history/chicagoruby-2026.jpg"
      alt: "A Chicago Ruby meetup in progress, with a speaker and attendees in the room."
