metadata:
  title: "Rooms I Was In: A Lived History"
  curator: "Mike Hall"
  description: >-
    A first-person timeline of the technical communities, teaching, work, and
    personal moments that shaped Mike Hall's life in technology. The photographs
    are his; dates and places are labeled by the evidence available for each item.
  introduction: >-
    I'm Mike Hall, a software developer and community builder. I didn't keep a
    tidy archive, but I saved these pictures of rooms where we learned
    together, communities we built, work that shaped my path, and unexpected
    days I still think about. This is part of the story I can tell through the
    photos I took.

trails:
  - id: learning-rooms
    title: "Making room to learn"
    description: "A short path through peer learning, from community tables to learning groups at work. These are related practices, not a claim that one group caused another."
    event_ids:
      - ticketsnow-scrum
      - obtiva-geekfest-july-2010
      - cloud-developers-group
      - first-scmc-meeting-2010
      - scmc-clojure-koans-2010
      - open-tech-talks-geekfest-omf
      - chicagoruby-2026
    destination:
      label: "Explore the SCMC archive"
      url: "/scmc/"
  - id: recording-community
    title: "From community rooms to recorded conversations"
    description: "Photographs of gatherings sit alongside the interview archive. Follow the people and places without treating attendance as authorship of their work."
    event_ids:
      - chicago-altnet-fawad-halim-2010
      - scna-2010
      - chicago-code-camp-2011
      - ugtastic-sign-at-groupon
    destination:
      label: "Browse the interviews"
      url: "/interviews/"
  - id: observability-practice
    title: "Learning about systems together"
    description: "Internal learning sessions, conference photographs, and the OpenTelemetry Working Group show different parts of the same period of engineering practice."
    event_ids:
      - open-tech-talks-geekfest-omf
      - kubecon-observability-day-2023
      - kubecon-chicago-2023
      - otel-working-group-handoff
    destination:
      label: "Read the OneMain role record"
      url: "/resume/positions/onemain/"
  - id: phalanx-duel
    title: "Phalanx Duel at the workbench"
    description: "Start with the notebook and pen, then explore the game project. The photograph dates the objects, not the beginning of the project."
    event_ids:
      - phalanx-duel-notebook-origin
    destination:
      label: "Explore the Phalanx Duel project"
      url: "https://github.com/phalanxduel/phalanxduel"

