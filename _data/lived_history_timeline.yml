  - id: obtiva-acquisition-gathering-2011
    date_sort: "2011-08-09"
    date_display: "August 9, 2011"
    date_evidence: "Date in the original photo filenames and album title."
    era: community-rooms
    kind: community
    title: "The day Obtiva learned about the Groupon acquisition"
    location: "Obtiva, Chicago"
    location_evidence: "Mike's recollection of the all-company gathering at Obtiva."
    narrative: >-
      This was an all-Obtiva gathering to hear that we had been acquired by
      Groupon and to learn the plan going forward. I took these photos without
      fully understanding what the news meant. Looking back, I can see this as
      the end of an era: a roomful of people and a company about to change.
    communities: ["Obtiva"]
    photo:
      path: "/assets/images/lived-history/obtiva-acquisition-gathering-2011.jpg"
      alt: "Obtiva's people gather for the company-wide meeting about the Groupon acquisition and the plan going forward."
    source: "Mike's recollection; date is from the original photo filenames and Google Photos album."
    source_album: "Last Obtiva Geekfest (original Google Photos album title)"

