metadata:
  title: "Rooms I Was In: A Lived History"
  curator: "Mike Hall"
  description: >-
    A first-person timeline of the technical communities, teaching, work, and
    personal moments that shaped Mike Hall's life in technology. The photographs
    are his; dates and places are labeled by the evidence available for each item.
  introduction: >-
    I did not keep a tidy archive. These are moments that stayed with me: rooms
    where people learned together, work that became a community, and the
    unexpected days that gave the rest of life its texture. The photographs are
    mine. I label what comes from a photo record separately from what I remember.
    I am also an Eagle Scout, a milestone I remain proud of; a family clipping
    records it, though its publication year is not established here.

eras:
  - id: family-roots
    label: "Before 2005 · Family and early life"
    first_event_id: fathers-work-and-trucks
  - id: early-practice
    label: "2005–2009 · Learning and teaching"
    first_event_id: ticketsnow-scrum
  - id: community-rooms
    label: "2010–2012 · The community rooms and corridors"
    first_event_id: cloud-developers-group
  - id: life-outside-work
    label: "2018–2020 · Unexpected days and older history"
    first_event_id: weird-al-and-emo-phillips
  - id: internal-community
    label: "2022–2025 · Work, making, and life outside it"
    first_event_id: open-tech-talks-geekfest-omf
  - id: current-practice
    label: "2026 · Still showing up"
    first_event_id: chicagoruby-2026

events:
  - id: fathers-work-and-trucks
    date_sort: "1988-01-01"
    date_display: "1988 and undated family photographs"
    date_evidence: "One truck photograph is handwritten '1988'; the black-and-white photograph of my father at work is undated."
    era: family-roots
    kind: personal
    title: "My father's work and trucks"
    location: "Location not established"
    narrative: >-
      This album holds a few fragments of my father's life: a truck marked
      1988, and a black-and-white photograph of him at work at CW. The dates
      are uneven, but together they give me a glimpse of the work and world
      that were part of my family story before my own technology-community
      years.
    photos:
      - path: "/assets/images/lived-history/fathers-truck-1988.jpg"
        alt: "A green semi truck with its license plate obscured; the print is handwritten 1988."
      - path: "/assets/images/lived-history/father-at-work.jpg"
        alt: "A black-and-white photograph of Mike's father at work at CW."
    source: "Mike's Google Photos album and recollection; the handwritten year appears on the truck print."
    source_album: "Photos-1-001 (6)"

  - id: ticketsnow-scrum
    date_sort: "2006-01-01"
    date_display: "2005–2007 · TicketsNow"
    date_evidence: "TicketsNow role record; the date of each class is not established by the later note photographs."
    era: early-practice
    kind: teaching
    title: "Learning Scrum by helping a team practice it"
    location: "Crystal Lake, Illinois"
    narrative: >-
      At TicketsNow I introduced and led Scrum practices with the core transaction
      engineering team. The notes preserve what I was teaching: keep the product
      backlog focused on prioritized requirements, draw the sprint backlog from
      it, and use progress charts to talk about the work. I photographed these
      pages in 2021, not during the classes, so the teaching dates remain
      approximate.
    source: "Mike's recollection and the public TicketsNow role record."
    source_album: "Scrum book notes circa 2005-06"
    link:
      label: "TicketsNow role"
      url: "/resume/positions/ticketsnow/"

  - id: cloud-developers-group
    date_sort: "2010-07-19"
    date_display: "July 19, 2010"
    date_evidence: "Date in the original photo filenames and album title; the capture EXIF date is absent."
    era: community-rooms
    kind: community
    title: "Cloud Developers' Group around a table"
    location: "Chicago area; exact venue not established"
    location_evidence: "Album context; no reliable GPS location in the selected photo."
    narrative: >-
      This is the kind of room I wanted to make possible: a few people, laptops
      open, trading ideas without needing a conference stage. The same five
      photographs appear in another July 2010 export, so I count this as one
      meeting rather than two separate events.
    communities: ["Cloud Developers' Group"]
    photo:
      path: "/assets/images/lived-history/cloud-developers-group-2010.jpg"
      alt: "A small Cloud Developers' Group meeting gathered around a table with laptops."
    source: "Mike's Google Photos album; the selected image is one of five repeated in a second export."
    source_album: "Cloud Developer's Group Meeting July 2010"

  - id: obtiva-geekfest-july-2010
    date_sort: "2010-07-20"
    date_display: "July 20, 2010"
    date_evidence: "Capture date in the original image EXIF and the Google Photos album title."
    era: community-rooms
    kind: community
    title: "Geekfest at Obtiva: a room built for learning together"
    location: "Obtiva, Chicago"
    location_evidence: "Google Photos album title and event context."
    narrative: >-
      Geekfest was Obtiva's recurring study group and apprenticeship forum. I
      joined the room as a practitioner and learned from the people who made
      time to teach, try ideas, and work through code together. This album also
      includes Brian Marick's July session at Obtiva.
    communities: ["Geekfest", "Obtiva"]
    photo:
      path: "/assets/images/lived-history/obtiva-geekfest-july-2010.jpg"
      alt: "A full room of developers listening during a Geekfest session at Obtiva."
    source: "Mike's Google Photos album; original capture date retained in EXIF, removed from the public derivative."
    source_album: "2010 July 20 Geekfest at Obtiva"
    link:
      label: "The community timeline"
      url: "/timeline/community/"

