  - id: kubecon-chicago-2023
    date_sort: "2023-11-07"
    date_display: "November 7, 2023 · KubeCon + CloudNativeCon North America"
    date_evidence: "Original EXIF capture time and GPS rounded to the city; the public derivative contains no EXIF or coordinates."
    era: internal-community
