    location: "McHenry County, Illinois; exact venue not established by the album"
    location_evidence: "Album title and community context."
    narrative: >-
      Colin Jones led a Clojure Koans session. People learned by working through
      small exercises together, asking questions as the code made each idea
      concrete. That format still shapes how I think about a useful technical
      learning session.
    communities: ["SCMC", "Clojure"]
    photo:
      path: "/assets/images/lived-history/scmc-clojure-koans-2010.jpg"
      alt: "A presenter walks through a Clojure Koans exercise with an SCMC group."
