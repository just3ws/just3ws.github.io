  - id: chicago-woodpecker-rescue
    date_sort: "2018-04-16"
    date_display: "April 16, 2018"
    date_evidence: "Date in the original photo filenames and album title."
    era: life-outside-work
    kind: personal
    title: "The woodpecker on the way to a job interview"
    location: "Chicago, Illinois"
    location_evidence: "Mike's recollection; the album title identifies the day, not the place."
    narrative: >-
      I was heading to a job interview when I found a woodpecker on the sidewalk.
      I contacted a Chicago bird rescue, and they came to recover it before I
      went in. It was a Scandinavian company. They were not charmed that I had
      stopped to rescue the bird, and they passed on me. It was a very strange
      day in the city.
    photo:
      path: "/assets/images/lived-history/woodpecker-rescue-2018.jpg"
      alt: "A woodpecker rests in Mike's hands before the bird rescue collected it."
    source: "Mike's Google Photos album and personal recollection."
    source_album: "Operation Woodpecker Awake - 2018-04-16"

  - id: cantigny-sfor-brcko
    date_sort: "2020-03-07"
    date_display: "March 7, 2020 · Cantigny Park"
    date_evidence: "Date in the original image filename; the public derivative has metadata removed."
    era: life-outside-work
    kind: personal-history
    title: "Revisiting the Bosnia deployment through Brčko"
    location: "Cantigny Park, Illinois"
    location_evidence: "Mike's recollection and the Google Photos album context."
    narrative: >-
      At Cantigny Park, I photographed a First Division Museum exhibit about
      the Bosnia and Herzegovina conflict and the Brčko area. It brought me
      back to my own Bosnia deployment with SFOR. The photograph here shows
      the museum exhibit that made the connection for me.
    photos:
