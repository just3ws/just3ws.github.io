events:
  - id: eagle-scout-milestone
    date_sort: "0000-01-01"
    date_display: "Date not recorded · an early milestone"
    date_evidence: "The newspaper clipping identifies Mike Hall's Eagle Scout achievement; its publication date is not visible in the source photo."
    era: family-roots
    kind: personal
    title: "Eagle Scout, proudly"
    narrative: >-
      I earned the rank of Eagle Scout. I'm proud of the work it took and still
      carry that milestone with me. This clipping is one small piece of my
      early story.
    photo:
      path: "/assets/images/lived-history/eagle-scout-clipping-photo.jpg"
      alt: "A newspaper photo of Mike in his Scout uniform at his Eagle Scout recognition."
    source: "Mike's Google Photos album and recollection."
    source_album: "Photos-1-001 (6)"

  - id: fathers-work-and-trucks
    date_sort: "1988-01-01"
    date_display: "1988 and undated family photographs"
    date_evidence: "One truck photograph is handwritten '1988'; the black-and-white photograph of my father at work is undated."
    era: family-roots
    kind: personal
    title: "My father's work and trucks"
    location: "Location not established"
    narrative: >-
      This album holds a few fragments of my father's life: a green Autocar,
      one of his pride-and-joy trucks, and a black-and-white photograph of him
      at work at CW. It is a quiet glimpse of the family business and the world
      around me as I was growing up. I will tell more about the work I did with
      Lotus 1-2-3 and Approach '97, and my early web pages in FrontPage '97,
      another time. He also had a black Autocar called Warcloud, named for the
      artwork on its back; I will add that story when I find the photo. One
      truck print is marked 1988; the other dates are not established.
    photos:
      - path: "/assets/images/lived-history/fathers-truck-1988.jpg"
        alt: "My father's green Autocar semi truck, with its license plate obscured; the print is handwritten 1988."
      - path: "/assets/images/lived-history/father-at-work.jpg"
        alt: "A black-and-white photograph of Mike's father at work at CW."
    source: "Mike's Google Photos album and recollection; the handwritten year appears on the truck print."
    source_album: "Photos-1-001 (6)"

  - id: ticketsnow-scrum
    date_sort: "2006-01-01"
    date_display: "2005–2007 · TicketsNow"
    date_evidence: "TicketsNow role record; the date of each class is not established by the later note photographs."
    era: early-practice
    kind: teaching
    title: "Learning Scrum by helping a team practice it"
    location: "Crystal Lake, Illinois"
    narrative: >-
      At TicketsNow I introduced and led Scrum practices with the core transaction
      engineering team. The notes preserve what I was teaching: keep the product
      backlog focused on prioritized requirements, draw the sprint backlog from
      it, and use progress charts to talk about the work. I photographed these
      pages in 2021, not during the classes, so the teaching dates remain
      approximate.
    source: "Mike's recollection and the public TicketsNow role record."
    source_album: "Scrum book notes circa 2005-06"
    link:
      label: "TicketsNow role"
      url: "/resume/positions/ticketsnow/"

