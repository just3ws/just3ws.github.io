  - id: first-scmc-meeting-2010
    date_sort: "2010-10-18"
    date_display: "October 18, 2010"
    date_evidence: "Date in the original photo filenames and album title; capture EXIF date is absent."
    era: community-rooms
    kind: community
    title: "The first Software Craftsmanship McHenry County meeting"
    location: "McHenry County, Illinois; exact venue not established by the album"
    location_evidence: "Album title and community context."
    narrative: >-
      Ryan Gerry and I helped start Software Craftsmanship McHenry County
      (SCMC) as a place to practice, discuss, and share software craftsmanship
      close to home. Seeing the name on the board still brings me back to the
      beginning: a community takes shape when people keep making room for one
      another.
    communities: ["SCMC", "Software Craftsmanship"]
    photo:
      path: "/assets/images/lived-history/first-scmc-meeting-2010.jpg"
      alt: "A handwritten Software Craftsmanship McHenry County sign at the first SCMC meeting."
    source: "Mike's Google Photos album; date is from the filename and album title."
    source_album: "First Ever SCMC Meeting"
    link:
      label: "SCMC archive"
      url: "/scmc/"

  - id: scmc-clojure-koans-2010
    date_sort: "2010-11-16"
    date_display: "November 16, 2010"
    date_evidence: "Date in the original photo filenames; the public derivative has metadata removed."
    era: community-rooms
    kind: teaching
    title: "Clojure Koans at SCMC"
    location: "McHenry County, Illinois; exact venue not established by the album"
    location_evidence: "Album title and community context."
    narrative: >-
      Colin Jones led a Clojure Koans session. People learned by working through
      small exercises together, asking questions as the code made each idea
      concrete. That format still shapes how I think about a useful technical
      learning session.
    communities: ["SCMC", "Clojure"]
    photo:
      path: "/assets/images/lived-history/scmc-clojure-koans-2010.jpg"
      alt: "A presenter walks through a Clojure Koans exercise with an SCMC group."
    source: "Mike's Google Photos album; date is from original filenames and album title."
    source_album: "SCMC - Clojure Koans w-Colin Jones"

  - id: chicago-code-camp-2011
    date_sort: "2011-05-14"
    date_display: "May 14, 2011 · Chicago Code Camp 3"
    date_evidence: "Date in the original photo filenames and album title."
    era: community-rooms
    kind: community
    title: "Chicago Code Camp: a shirt people wanted to wear"
    location: "Chicagoland; the venue is not established by this album"
    location_evidence: "Album title and event context."
    narrative: >-
      Another person designed the Chicago Code Camp logo. I helped decide which
      submission to use, adapted the logo for the CCC shirt and sticker design,
      and integrated it into the website. The shirt became wildly popular. I
      remember the design work as one small piece of making a free community
      conference feel like something people belonged to.
    communities: ["Chicago Code Camp"]
    photo:
      path: "/assets/images/lived-history/chicago-code-camp-2011.jpg"
      alt: "A speaker addresses the audience at Chicago Code Camp 3."
    source: "Mike's Google Photos album; date is from original filenames and album title. The logo and design account is Mike's recollection."
    source_album: "Some pics from CCC3"
    link:
      label: "Chicago Code Camp retrospective"
      url: "/timeline/community/"

  - id: last-obtiva-geekfest-2011
    date_sort: "2011-08-09"
    date_display: "August 9, 2011"
    date_evidence: "Date in the original photo filenames and album title."
    era: community-rooms
    kind: community
    title: "The last Obtiva Geekfest in this photo archive"
    location: "Obtiva, Chicago"
    location_evidence: "Album title and event context."
    narrative: >-
      This album is titled “Last Obtiva Geekfest.” I also remember the day we
      learned Obtiva was being acquired by Groupon, but I have not established
      that it was the day pictured here, so I keep those memories separate.
      What these photos do show is a room full of people making time to learn
      together.
    communities: ["Geekfest", "Obtiva"]
    photo:
      path: "/assets/images/lived-history/last-obtiva-geekfest-2011.jpg"
      alt: "Developers gathered in a circle during the last Obtiva Geekfest represented in this archive."
