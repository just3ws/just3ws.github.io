    location_evidence: "Album and meeting context; no reliable GPS location in the selected photo."
    narrative: >-
      Fawad Halim presented Python for .NET Developers. Chicago Alt.NET made
      room for people to question the defaults of their day jobs and bring
      techniques from other communities back to their teams.
