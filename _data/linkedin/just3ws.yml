text: |-
  Architecting and operating production software platforms across Ruby on Rails 8, PostgreSQL 18 (pgvector), TypeScript, and local Metal GPU AI inference runtimes, combining deterministic state engines, autonomous media pipelines, forensic audio DSP restoration, and distributed OpenTelemetry observability.

  • Autonomous Media Pipeline & Local AI RAG Engine: Architected a Rails 8, Solid Queue, and PostgreSQL 18 (pgvector) media platform with Metal GPU Whisper transcription, hybrid Reciprocal Rank Fusion (RRF) search, local LLaMA 3.1 RAG synthesis via RubyLLM, OpenTelemetry tracing, and NIST SP 800-53 configuration validation across 270+ video masters.
  • Forensic Audio DSP Restoration & Sovereign Verification (dehum): Engineered a deterministic 5-stage FFmpeg audio restoration and clock-drift synchronization pipeline (atempo, adeclick, highpass, afftdn, and 8-harmonic 60 Hz notch cascade) eliminating EMI hum and corona discharge crackle recorded under 345,000-volt transmission lines without video re-encoding.
  • Technical Conversation Archive & Knowledge Graph: Built a contract-validated oral history platform preserving 218 technical interviews with Software Craftsmanship, Ruby, and JVM practitioners, enforcing build-time schema verification, speaker diarization, and semantic graph cross-linking across 500+ indexed pages.
  • Deterministic State Engine (Phalanx Duel): Engineered a server-authoritative tactical game platform in TypeScript, Node.js, PostgreSQL, and WebSockets with a pure deterministic rules engine, replayable action ledger, and property-based CI gates.
  • Multi-Source Ingestion & Prompt-Injection Defense (WWWorkRemote): Designed a Rails 8 and pgvector matching platform with a Manifest V3 Chrome extension across 16 ATS adapters and a 4-stage prompt-injection defense pipeline.
