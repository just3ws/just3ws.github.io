text: |-
  I am Mike Hall, a Staff Software Engineer who makes complex production systems easier to understand, safer to change, and easier for teams to own.

  I start by learning how people use a system, what the business needs, and where the real constraints are. Then I work from code and runtime behavior toward a practical solution, clearer ownership, and safer change. I also coach engineers and make technical ideas easier to share.

  At Groupon, I built engineering onboarding and training during a period of rapid growth. At OneMain Financial, I founded Geekfest@OMF and led an OpenTelemetry Working Group from 2024 through 2025, creating spaces for shared learning and observability practice. The work moved to dedicated organizational ownership as those capabilities were staffed. At Assembly, I led Coderwall's transition to open source.

  I have also built public communities, including Cloud Developers Group and Software Craftsmanship McHenry County, and created the Chicago Code Camp website. Through UGtastic and WHOIS Tech Community, I recorded more than 200 interviews about the people and ideas shaping software practice.

  Today I create Phalanx Duel, develop the Panoramic View method, and make Ramblin' & Amblin' while continuing to care for the interview archive. Across these roles, I value careful problem-solving, teaching, collaboration, and helping people do work they are proud of.
