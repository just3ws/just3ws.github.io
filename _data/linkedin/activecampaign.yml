text: |-
  Senior contract engagement on the Contacts team of a high-scale customer
  experience automation and CRM platform. Focused on testability, query
  performance, and change safety inside a tightly coupled legacy backend.

  • Legacy Query Modernization: Replaced ad-hoc global data access with
  structured, cacheable query patterns in the PHP backend, enabling unit
  testability and sub-second query execution across multi-million contact
  datasets.
  • Automated Verification Gates: Hardened Ember.js automated test suites
  across core CRM contact workflows, creating safety gates that enabled
  non-breaking legacy backend refactoring.
