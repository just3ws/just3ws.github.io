teleprompter_script:
  act_1: |
    [SCENE: Camera. Show the November 19, 2011 interview frame from SCNA 2011.]
    This is The Sound Above. I'm Mike Hall.
    Today I'm going back to November 19, 2011, at Software Craftsmanship North America at the Swissotel in downtown Chicago.
    My very first UGtastic interview was with Sergio Pereira, the organizer of Chicago Alt.NET.
    I didn't have a studio rig or a camera crew that day.
    I just sat down with Sergio in the hallway, flipped open my 15-inch unibody MacBook Pro, opened Photo Booth, and recorded using the laptop's built-in camera and microphone.
    [PAUSE]
    There is a personal reason I asked Sergio to sit down first.
    Chicago Alt.NET was the first user group where I ever stood up and gave a talk.
    When I went back through my old blog posts from August 2008, I found a detail that made me smile.
    My first Chicago Alt.NET meeting was Wednesday, August 13, 2008.
    I rode the Metra Union Pacific Northwest train in from Crystal Lake to see a demo of ThoughtWorks Studios' new Cruise continuous integration server.
    And the person who recorded, edited, and posted the video of that meeting online, including my questions from the audience, was Sergio Pereira.
    Three years later at SCNA, we traded places, and I recorded him.
    [SHOW: August 2008 blog posts and the November 19, 2011 interview frame.]
    [FREEFORM: Share what you remember about riding the Metra train in from Crystal Lake and sitting down with Sergio at SCNA 2011.]
  act_2: |
    [SCENE: Camera. Keep the Chicago Alt.NET Wayback archive nearby.]
    Right at the start of the recording, I ask Sergio a simple question: what is Chicago Alt.NET?
    Notice how he answers. He refuses to give a neat ideological definition.
    Instead, he describes the people in the room and what they were trying to do.
    They were working developers who used .NET every day, liked .NET, and wanted to improve their craft and the quality of the software they wrote.
    Back in April 2007, David Laribee had published the Alt.NET Manifesto, and that October developers gathered in Austin for the first Alt.NET Open Spaces.
    Sergio started Chicago Alt.NET in late 2007 with Derik Whittaker and Ryan Rinaldi, and later ran it with Eduardo Scoz.
    [PAUSE]
    What stands out when I listen now is how much the practical logistics mattered.
    They met on the second Wednesday of every month at 6:30 PM at Redpoint Technologies in the Sears Tower.
    Redpoint gave the group the meeting room and sponsored the pizza every month.
    And 6:30 PM was a deliberate compromise: not too late for people working in the Loop, and early enough for suburban commuters catching the 8:30 PM Metra train home.
    A typical meeting had about twenty-five people.
    Sergio points out that twenty-five is a great size for someone who has never spoken at a user group before.
    He encouraged members to take the talks they had already given to their teams at work and bring them to the group.
    [SHOW: November 2008 chicagoalt.net Wayback snapshot.]
    I was living proof of that charter.
    On November 12, 2008, just three months after my first meeting, I stood up at Redpoint Technologies and gave my first presentation on the NHaml view engine, right alongside Adam Tybor presenting on Spark.
    [FREEFORM: Talk about what it felt like to prepare and give that first NHaml talk in a room of twenty-five peers.]
  act_3: |
    [SCENE: Camera, then split screen with the archive timeline and git log.]
    The question I want to follow in this rewatch is straightforward.
    What made Chicago Alt.NET a place where people kept coming back, and how did that room connect to the wider Chicago software community?
    Sergio says the group was never only about Microsoft or .NET. It was about software development.
    He names NHibernate, CodeSharp, IronRuby, test-driven development, behavior-driven development, and Kanban as topics that needed a venue.
    In his April 2009 Wrox book, Ruby on Rails for Microsoft Developers, Antonio Cangiano documented how Alt.NET developers looking to Castle MonoRail and Rails helped push Microsoft from WebForms postbacks toward ASP.NET MVC and shipping jQuery inside Visual Studio.
    [PAUSE]
    While preparing this episode, three pieces of archival evidence clicked together with what Sergio says on the tape.
    First, at the eleven-minute mark, Sergio talks about experimenting with fishbowl debates and open formats.
    In my March 12, 2009 blog recap, I wrote about one of those exact four-chair Fishbowl nights where Adam Tybor led a debate on Domain-Driven Design and Sergio held a second circle discussion on the db4o object database until nine at night.
    Second, that same spring, Sergio joked on Twitter that retweeting Scott Hanselman was pointless because anyone following us already followed Scott.
    I disagreed, and in the spirit of that community, I built an ASP.NET MVC app called twatio.com to measure unique follower overlap empirically. Years later, twatio.com redirected straight to ugtastic.com.
    [SHOW: Chicago Code Camp just3ws/ccs commit log and Signatory Network Map.]
    Third, listen at ten minutes and twenty-nine seconds when Sergio mentions participating in Chicago Code Camp so it wouldn't be exclusively about .NET.
    We recently resurrected the 2010 to 2012 Ruby on Rails repository, just3ws/ccs, that powered chicagocodecamp.com, and cross-referenced the Software Craftsmanship Manifesto ledger.
    Sergio signed the Manifesto in 2009 as Signatory 592 from Grayslake, Illinois, right where Chicago Code Camp met at the College of Lake County.
    And in the git history of our Rails app, Sergio Pereira is the number two code contributor with twenty-four commits in Ruby, Haml, and Sass alongside my 764 commits, and he spoke at the May 2012 camp.
    He didn't just talk about crossing platform boundaries. He wrote Ruby on Rails code with us to help run a free community conference.
    [FREEFORM: Reflect on rediscovering Sergio's 24 commits in the Chicago Code Camp Rails repo and his #592 Manifesto signature.]
  act_4: |
    [SCENE: Switch to archive tape in Scene 03.]
    [REWATCH: Sergio Pereira interview (YouTube qOHdZKz1WFw), start at 00:00.]
    Let's play the 2011 conversation with Sergio Pereira.
    Let his description of the group carry the story.
    [FREEFORM: React to the tape naturally. Pause when a specific moment or phrase stands out.]
    Watch for these turns as the recording plays:
    At 00:00, why Sergio resists defining Alt.NET and focuses on continuous improvement.
    At 02:19, the second Wednesday at 6:30 PM at Redpoint in the Sears Tower and the suburban train commute.
    At 03:06, the twenty-five-person room and his charter to cultivate speakers from inside the community.
    At 05:17, my thank-you to Sergio for the room where I gave my first user group talk, and his memories of starting the group in late 2007 with Derik Whittaker and Ryan Rinaldi.
    At 07:09, giving working developers a chance to see TDD, BDD, and tools from other platforms and judge for themselves.
    At 10:29, cross-platform regulars, Kanban, and participating in Chicago Code Camp.
    At 11:42, Redpoint's pizza sponsorship, trying open projector nights and fishbowl debates, and curating speakers with Eduardo Scoz compared to ChicagoRuby.
    [SCENE: Return to camera after the tape finishes.]
    [FREEFORM: Immediate reaction: what sounded different on the tape today compared to how you remembered it?]
  act_5: |
    [SCENE: Workbench. Show the interactive transcript beside the Signatory Network Map and ccs git log.]
    Having the searchable transcript open beside this recording changes how I hear it.
    For a long time, I wasn't sure these two hundred interviews would ever be transcribed.
    In 2014, I created a repository called many-hands-make-light-work to crowdsource transcripts from the community, because commercial cloud speech APIs cost thousands of dollars and manual transcription was too much for one person.
    It took building our five-Raspberry-Pi whisper.cpp Fluffle cluster in 2023, and now running local Apple Silicon transcription in our media pipeline, to turn that 2011 Photo Booth recording into a verified forty-four-turn transcript with thirteen chapters.
    [PAUSE]
    When I read Sergio's words on line 145 of the transcript, he says something that still holds up fifteen years later:
    "That's the place that they can come, see those things, and judge for themselves if it's going to work for them or not."
    In 2008, the default vendor path was drag-and-drop WebForms wizards that hid HTTP and made unit testing painful.
    Today, the default path is often generative AI tools that can produce hundreds of lines of plausible code without explaining the domain boundaries underneath.
    The lesson from Chicago Alt.NET is modest and durable.
    Tools change every few years, and no vendor default does your engineering judgment for you.
    We still need rooms where working developers can show what they are actually building, look across boundaries, and test whether a new tool holds up in practice.
    [FREEFORM: Compare what you remembered with what the transcript and archival records show side by side.]
  act_6: |
    [SCENE: Outro card with Sergio Pereira's name and the episode link.]
    Thank you to Sergio Pereira for building that room in Chicago, for writing code with us on Chicago Code Camp, and for sitting down with me at SCNA 2011 for the very first UGtastic interview.
    And thank you for watching Episode 1 of The Sound Above.
    The full interactive transcript, the 2008 and 2009 Chicago Alt.NET meeting recaps, the Software Craftsmanship Manifesto Signatory Network Map, and the Chicago Code Camp archive are all linked on the Episode 1 page at just3ws.com.
    If you were in those rooms at ThoughtWorks, at Redpoint in the Sears Tower, at Chicago Code Camp in Grayslake, or at SCNA, leave a comment and tell me what you remember.
    If I got a detail wrong, point me to the source so I can update the record.
    You can find the rest of the archive and ways to support this work at just3ws.com/support.
    Next time, Ray Hightower talks about ChicagoRuby and grassroots hospitality.
    Until then, keep your feedback loops fast, take care of each other, and keep making room to learn.
