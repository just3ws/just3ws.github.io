    To understand why that room mattered, you have to remember what enterprise .NET felt like in 2007.
    [FREEFORM: Paint the picture - the WebForms world. ViewState. The page lifecycle. How you felt
    about the default Microsoft toolchain before Alt.NET. What people actually said to you about NHibernate.]
    Most corporate shops treated MSDN as the law.
    If a tool didn't ship inside Visual Studio, you weren't supposed to touch it.
    On April 10, 2007, David Laribee published the Alt.NET Manifesto.
    [SHOW: web.archive.org/web/20070701125236/http://laribee.com/blog/2007/04/10/altnet/]
    Four tenets. Worth reading exactly as written:
    One: You use what works while keeping an eye out for a better way.
    Two: You reach outside the mainstream to adopt the best of any community.
    Three: You are not content with the status quo.
    Four: You know tools are great, but they only take you so far.
    That October, developers gathered in Austin for the first Alt.NET Open Spaces.
    Martin Fowler documented it in his Bliki.
    [FREEFORM: Talk about Sergio specifically - when did you first encounter him, what was the energy
