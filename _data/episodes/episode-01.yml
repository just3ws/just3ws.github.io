teleprompter_script:
  act_1: |
    [SCENE: Camera. Show the November 19, 2011 interview frame from SCNA 2011.]
    Fifteen years ago, I began recording over two hundred interviews with working developers around Chicago and North America.
    Most were captured in hotel hallways, conference lounges, and meetup rooms, and for over a decade they quietly lived in an archive.

    Now I'm revisiting them one by one.
    Not for nostalgia, and not to put anyone on a pedestal.
    I want to listen back with full transcripts, old blog entries, Wayback pages, and recovered git repos right beside the tape, to learn what truly built durable developer communities before the AI era, and what holds up today.

    [PAUSE]
    Welcome to The Sound Above. I'm Mike Hall.

    For Episode 1, we're going back to the very first UGtastic interview I ever recorded: November 19, 2011, at Software Craftsmanship North America at the Swissotel in downtown Chicago, with Sergio Pereira, founder and organizer of Chicago Alt.NET.

    I had no camera crew or real rig that day.
    I met Sergio in the hallway, flipped open my 15-inch unibody MacBook Pro, launched Photo Booth, and recorded right on the laptop's built-in webcam and mic.

    [PAUSE]
    There is a personal angle to why I invited Sergio first.
    Chicago Alt.NET was the first user group where I ever got up and gave a talk.

    Looking back through my August 2008 blog entries, I found a detail that made me grin.
    My first Chicago Alt.NET meeting was Wednesday, August 13, 2008.
    I rode the Metra Union Pacific Northwest train in from Crystal Lake to watch a demo of ThoughtWorks' new Cruise build tool.

    And the guy who filmed, edited, and uploaded that meeting video, including my audience Q&A, was Sergio Pereira.
    Three years later at SCNA, we traded roles, and I recorded him.
    [SHOW: August 2008 blog posts and the November 19, 2011 interview frame.]
    [FREEFORM: Share what you remember about riding the Metra train in from Crystal Lake and sitting down with Sergio at SCNA 2011.]
  act_2: |
    [SCENE: Camera. Keep the Chicago Alt.NET Wayback archive nearby.]
    Right at the top of the recording, I ask Sergio a plain question: what is Chicago Alt.NET?
    Notice how he replies.
    He turns down any neat ideological label.

    Rather than a slogan, he talks about the people in the room and what they were trying to do.
    They were working developers who wrote .NET every day, liked .NET, and wanted to level up their craft and the quality of their code.

    In April 2007, David Laribee wrote the Alt.NET Manifesto, and that October developers gathered in Austin for the first Alt.NET Open Spaces.
    Sergio launched Chicago Alt.NET in late 2007 with Derik Whittaker and Ryan Rinaldi, and later ran it with Eduardo Scoz.

    [PAUSE]
    What stands out when I hear it now is how much practical planning mattered.
    They met on the second Wednesday of every month at 6:30 PM at Redpoint in the Sears Tower.
    Redpoint gave the group the room and bought the pizza every month.

    And 6:30 PM was a deliberate middle ground: not too late for people working in the Loop, and early enough for suburban commuters catching the 8:30 PM Metra train home.

    A typical night drew around twenty-five people.
    Sergio points out that twenty-five is an ideal room for someone who has never given a user group talk before.
    He encouraged members to take a talk they had already shared with their team at work and bring it to the group.

    [SHOW: November 2008 chicagoalt.net Wayback snapshot.]
    I was living proof of that charter.
    On November 12, 2008, only three months after my first Chicago Alt.NET meeting, I got up at Redpoint and gave my first user group talk on the NHaml view engine, right alongside Adam Tybor talking about Spark.
    [FREEFORM: Talk about what it felt like to prepare and give that first NHaml talk in a room of twenty-five peers.]
  act_3: |
    [SCENE: Camera, then split screen with the archive timeline and git log.]
    The question I want to follow in this rewatch is clear.
    What made Chicago Alt.NET a room people kept coming back to, and how did it connect to the wider Chicago developer community?

    Sergio points out the group was never only about .NET. It was about software development.
    He names NHibernate, CodeSharp, IronRuby, TDD, BDD, and Kanban as ideas that needed a real venue.

    In his April 2009 Wrox book, Ruby on Rails for Microsoft Developers, Antonio Cangiano noted how Alt.NET developers looking to Castle MonoRail and Rails helped nudge Microsoft from WebForms toward ASP.NET MVC and bundling jQuery in Visual Studio.

    [PAUSE]
    While prepping for today, three archival finds lined up right with what Sergio mentions on tape.

    First, around the eleven-minute mark, Sergio talks about trying open formats and fishbowl debates.
    In my March 12, 2009 blog recap, I wrote about one of those four-chair Fishbowl nights, with Adam Tybor leading a debate on Domain-Driven Design and Sergio running a second circle on the db4o object database until nine at night.

    Next, that spring, Sergio joked on Twitter that retweeting Scott Hanselman made no real impact because everyone following us already followed Scott.
    I disagreed, and in the spirit of that group, I built an ASP.NET MVC web app called twatio.com to measure unique follower overlap with real data.
    Years later, twatio.com pointed right over to ugtastic.com.

    [SHOW: Chicago Code Camp just3ws/ccs commit log and Signatory Network Map.]
    Third, listen at ten minutes and twenty-nine seconds when Sergio mentions helping with Chicago Code Camp so it would go beyond .NET.
    We recently dug up the 2010 to 2012 Ruby on Rails repo, just3ws/ccs, that ran chicagocodecamp.com, and checked it against the Software Craftsmanship Manifesto ledger.

    Sergio signed the Manifesto in 2009 as Signatory 592 from Grayslake, Illinois, right where Chicago Code Camp met at the College of Lake County.
    And in the git history of our Rails app, Sergio Pereira is the number two contributor with twenty-four commits in Ruby, Haml, and Sass alongside my 764 commits, and he spoke at the May 2012 camp.

    He didn't merely talk about crossing language boundaries.
    He wrote Ruby on Rails code with us to help run a free community conference.
    [FREEFORM: Reflect on rediscovering Sergio's 24 commits in the Chicago Code Camp Rails repo and his #592 Manifesto signature.]
  act_4: |
    [SCENE: Switch to archive tape in Scene 03.]
    [REWATCH: Sergio Pereira interview (YouTube qOHdZKz1WFw), start at 00:00.]
    Let's play the 2011 conversation with Sergio Pereira.
    Let his description of the group carry the story.
    [FREEFORM: React to the tape naturally. Pause when a specific moment or phrase stands out.]
    Watch for these turns as the recording plays:
    At 00:00, why Sergio resists defining Alt.NET and focuses on continuous improvement.
    At 02:19, the second Wednesday at 6:30 PM at Redpoint in the Sears Tower and the suburban train commute.
    At 03:06, the twenty-five-person room and his charter to cultivate speakers from inside the community.
    At 05:17, my thank-you to Sergio for the room where I gave my first user group talk, and his memories of starting the group in late 2007 with Derik Whittaker and Ryan Rinaldi.
    At 07:09, giving working developers a chance to see TDD, BDD, and tools from other platforms and judge for themselves.
    At 10:29, cross-platform regulars, Kanban, and participating in Chicago Code Camp.
    At 11:42, Redpoint's pizza sponsorship, trying open projector nights and fishbowl debates, and curating speakers with Eduardo Scoz compared to ChicagoRuby.
    [SCENE: Return to camera after the tape finishes.]
    [FREEFORM: Immediate reaction: what sounded different on the tape today compared to how you remembered it?]
  act_5: |
    [SCENE: Workbench. Show the interactive transcript beside the Signatory Network Map and ccs git log.]
    Having the full transcript open right beside this recording changes how I hear it.
    For a long time, I doubted these two hundred interviews would ever be transcribed.

    In 2014, I built a repo called many-hands-make-light-work to crowd-transcribe them with the community, because paid cloud audio APIs were way too pricey and manual typing was too much for one person.

    It took building our five-Raspberry-Pi whisper.cpp Fluffle cluster in 2023, and now running local Apple Silicon transcription in our media pipeline, to turn that 2011 Photo Booth recording into a verified forty-four-turn transcript with thirteen chapters.

    [PAUSE]
    When I read Sergio's line 145 in the transcript, his point holds up fifteen years later:
    "That's the place that they can come, see those things, and judge for themselves if it's going to work for them or not."

    In 2008, the default vendor path was drag-and-drop WebForms wizards that hid HTTP and made unit testing painful.
    Today, the default path is often generative AI tooling that can output hundreds of lines of convincing code without revealing the domain boundaries underneath.

    The takeaway from Chicago Alt.NET is grounded and durable.
    Tools turn over every few years, and no vendor default replaces your engineering judgment.
    We still need rooms where working developers can demo what they are building, look beyond their own stack, and verify whether a new tool holds up in practice.
    [FREEFORM: Compare what you remembered with what the transcript and archival records show side by side.]
  act_6: |
    [SCENE: Outro card with Sergio Pereira's name and the episode link.]
    Thank you to Sergio Pereira for building that room in Chicago, for writing code with us on Chicago Code Camp, and for recording that very first UGtastic interview with me at SCNA 2011.

    And thank you for watching Episode 1 of The Sound Above.
    The full interactive transcript, the 2008 and 2009 Chicago Alt.NET meeting recaps, the Software Craftsmanship Manifesto Signatory Network Map, and the Chicago Code Camp archive are all linked on the Episode 1 page at just3ws.com.

    If you were in those rooms at ThoughtWorks, at Redpoint in the Sears Tower, at Chicago Code Camp in Grayslake, or at SCNA, drop a comment and share what you remember.
    If I got a detail wrong, point me to the primary link and I'll update the record.

    You can explore the archive and find ways to back this project at just3ws.com/support.

    Next time, Ray Hightower talks about ChicagoRuby and building welcoming rooms.
    Until then, keep your feedback loops tight, take care of each other, and keep making room to learn.
