    About 25 of us. Pizza we paid for ourselves.
    November 12, 2008: I gave my first presentation. NHaml. Adam Tybor on Spark.
  act_3: |
    [SCENE: Cam]
    Here's the question guiding the rewatch today:
    How do working engineers build practical autonomy inside corporate environments
    without waiting for vendor permission?
    [FREEFORM: Talk about the twatio.com story - the Twitter debate with Sergio about retweeting Hanselman.
    The argument about whether retweets reach unique audiences. Building the ASP.NET MVC app to settle it empirically.
    Twatio later redirecting to ugtastic.com. That's the mindset in a nutshell: build a test.]
    When ASP.NET MVC was released it was a watershed.
    For nearly a decade Redmond had insisted on WebForms, page lifecycles, viewstate.
    The MVC pivot was the direct victory of the Ruby community.
    Rails. Sinatra. Merb. Convention over configuration, lightweight routing, testable controllers.
    Microsoft had to adapt because developers kept pointing at something better and saying: look.
    Alt.NET was never about hating .NET.
    As Sergio says right at the start of this tape: we liked .NET, used it every day,
    and wanted continuous improvement, automated testing, NHibernate, StructureMap, IronRuby in our daily work.
