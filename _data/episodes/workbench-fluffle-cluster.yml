teleprompter_script:
  act_1: |
    [SCENE: Camera on desk setup. MacBook Air visible with Dead Rabbit Radio sticker.]
    Last time on Studio Workbench, we looked at the whole eighteen-year Ship of Theseus: how a wooden boat of shell scripts turned into an Apple Silicon space station.
    Today, we zoom in on the single most important plank replacement in that ship's history.
    And it starts with this sticker right here on the lid of my MacBook Air, next to the Apple logo.
    [SHOW: Close-up of Dead Rabbit Radio sticker on MacBook lid]
    It is from Dead Rabbit Radio, a daily paranormal podcast hosted by Jason Carpenter.
    In fact, let me show you an Easter egg I found in the transcript archive.
    [SHOW: fluffle/transcripts/ep_0769_travis_scott_comp.srt at 00:00:49 and 00:14:53]
    On November 8, 2021, seventeen months before I wrote a single line of Fluffle code, Jason welcomed me into Dead Rabbit Command as a new Patreon supporter and had me flying the carbon helicopter.
    In show lore, Jason calls his supporter community The Fluffle, because a group of rabbits is called a fluffle.
    So when I spun up five Raspberry Pis in April 2023 to teach myself local speech recognition, there was only one name for the repository: The Fluffle.
  act_2: |
    [SCENE: Show just3ws/many-hands-make-light-work (2014) beside just3ws/fluffle (2023).]
    People ask why I did not start this experiment directly on the UGtastic interviews.
    I had over two hundred recorded conversations from Chicago conferences sitting on hard drives, and I had already failed once in 2014 with a crowdsourcing repo called many-hands-make-light-work.
    Cloud speech APIs cost thousands of dollars, and those interviews were irreplaceable community history.
    I refused to beta-test an unproven local AI pipeline on UGtastic.
    Dead Rabbit Radio gave me what every engineer needs before touching production cargo: a consistent solo speaker, over a thousand episodes, and zero risk to my primary archive.
  act_3: |
    [SCENE: Pan across fluffle-architecture-walkthrough.canvas and the Rakefile / bin/transcribe code.]
    Let us walk the actual architecture I built in April and May 2023.
    On the MacBook control plane, Curb and Nokogiri pulled the Libsyn RSS feed and parsed each episode GUID.
    Down followed up to sixteen or sixty-four HTTP redirects to grab the MP3, and FFmpeg converted it to 16-kilohertz mono PCM WAV.
    [SHOW: Rakefile lines 185-221 and bin/transcribe]
    Then Rakefile used Net::SSH to interrogate five Raspberry Pi 4s on my desk: node01 through node05, two 4Bs and three plain 4s running DietPi on Debian 11 aarch64 off USB thumbdrives.
    Before shipping a single WAV file, it checked two hard limits: at least five gigabytes free on the USB thumbdrive, and under two gigabytes of podcasts per node.
    On each Pi, bin/transcribe touched a dot-log lock file, ran whisper.cpp with the ggml-small model, deleted the WAV to protect the flash drive, and slept for 120 seconds so the stock passive heatsinks could cool down.
    And look at how it tracked progress without Redis: dotfile markers right on the filesystem.
    Dot-downloading, dot-downloaded, dot-converted, dot-distributed, dot-failed.
    If a Pi overheated and rebooted, nothing was lost. That exact dotfile pattern is the direct ancestor of the five-state Maildir queue we run in media-pipeline today.
  act_4: |
    [SCENE: Show fluffle/README.md and fluffle/replacements.yaml.]
    Remember in the Ship of Theseus episode when we talked about Peter Watts' Blindsight and Cunningham's bees?
    Bees build circles, and physics turns them into hexagons. Neural models extrude tokens without knowing what the world means.
    Here is the proof from 2023: whisper.cpp had zero concept of who Jason Carpenter was.
    In README.md and replacements.yaml, I documented over thirty different ways Whisper spelled his name: Garpenter, Garbineiro, Krupper, Carmoner, Garbender, and even Jason Asa.
    It transcribed "Dead Rabbit Dirigible" as "deadrabberdurgible".
    Look at the git timestamps on May 17, 2023: at 7:03 AM I wrote bin/replacements. At 7:08 AM I committed "Order matters in replacements.yml". At 7:12 AM, "Replace word suffixes last". At 7:13 AM, one automated pass fixed 981 files at once.
    Probabilistic inference needed a deterministic dictionary downstream.
  act_5: |
    [SCENE: Show git log of fluffle (79 commits) and bin/episode_checker.rb.]
    If you read all seventy-nine commits across sixty-seven days, you see the human story behind the code.
    Phase one was pure joy: fifty-one commits in twelve days, running jobs at six in the morning before work, at lunch, and at nine at night, even dedicating episode 381 to fellow listener Rudie Jazz.
    On April 8, I deleted twenty-six duplicate dot-wav-dot-srt files after catching a whisper.cpp naming quirk.
    Then on April 25, I hand-edited five hundred and nine files, realized manual cleanup could not scale, and went silent for twenty-two days.
    When I came back in May, I built the Rakefile state machine and episode_checker.rb so I could see all 1,175 rows across 1,073 episode directories in a green-and-red HTML table.
    When Jason mentioned transcripts on an episode, I drafted an April 6 DM explaining GitHub and CC BY-NC-ND 4.0, chatted with him on Discord, and verified he knew about the repo. No Dead Rabbit Radio episode ever discussed just3ws/fluffle on-air.
    On June 12, commit seventy-nine, Process 2.0, tried to generalize across multiple podcast feeds like Belief Hole and Philosophize This.
    Broken XML feeds, enterprise day-job incidents, and solo maintenance weight hit all at once, and I stopped.
  act_6: |
    [SCENE: Side-by-side of fluffle/episodes.html and 2026 media-pipeline cockpit on M4.]
    On git log alone, Fluffle looks like an abandoned experiment that stopped at commit seventy-nine.
    In reality, every survival rule in our 2026 Apple Silicon space station was earned on those five hot Raspberry Pis.
    The dotfile markers became our five-state Maildir queue.
    The sixteen-kilohertz mono transcode became ephemeral memory streaming with zero permanent disk waste.
    And those five Pis gave way to Apple Silicon M4 Metal transcribing twenty-eight minutes of speech in one hundred and three seconds.
    Thank you to Jason Carpenter for making Dead Rabbit Radio and for being generous when I reached out.
    If you want to support independent local compute and archival work like The Sound Above, you can join us at patreon.com/whoistechcmty.
    Next, we carry these verified transcripts straight into The Sound Above rewatch.
    Until next time: keep your feedback loops fast, and your code humane.
