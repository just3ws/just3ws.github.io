teleprompter_script:
  act_1: 'Welcome to The Sound Above: Minus Zero. I am Mike Hall. In October 2026,
    I walked out underneath 345,000-volt transmission lines in Northern Illinois with
    a smartphone to record some thoughts on software craftsmanship and identity. When
    I checked the footage back at my desk, the audio sounded completely destroyed:
    deafening 60 Hz electromagnetic hum, corona arcing, and an apparent three-and-a-half-minute
    clock drift between the audio and video. Trashing the footage and reshooting is
    the standard advice. But working through that desync kicked off an adventure:
    a series of articles on the mirage of competence, and a living case study in what
    happens when we lean on modern AI models. The bottleneck in engineering is never
    generation: it is verification.'
  act_2: 'I started with a simple thirteen-word query in a browser, then brought it
    into Gemini Flash through the terminal. The model immediately leapt into action:
    generating cascaded Butterworth filter equations, calculating exact duration ratios,
    and asserting with supreme, effortless confidence that the audio clock had drifted
    by twenty percent. It gave me shell scripts, math, and complete DSP pipelines.
    And it was all totally wrong. In Hollywood, investigators yell ''Enhance!'' and
    pixels appear out of thin air. In software, that wishful thinking produces hallucinated
    AI slop. It reminds me of the Dell Studio XPS laptop I carried during the 2009
    Obtiva days, with the sticker that read: ''Typing is not the bottleneck.'' In
    2026, generating code is not the bottleneck either. The bottleneck is domain understanding.'
  act_3: 'The container reported 21 minutes of video and only 18 minutes of audio.
    The model assumed linear drift and handed me atempo=0.837. When I tested the audio
    in my headphones, it was slurred and completely out of sync. So we went back to
    ground truth: high-FPS frame extraction, Whisper subtitle alignment, and audio
    waveforms. What actually happened? At 18 minutes, I said ''Thank you'' and wrapped
    the talk. The remaining three and a half minutes was just me walking with the
    camera running in silence. The speech was at 1.0x normal speed all along. When
    AI models project effortless competence, how do you verify where competence ends
    and plausible falsehood begins? You verify with empirical tests, not conversational
    trust.'
  act_4: Let us look at the raw recording from the phone. Modern smartphones use dual
    microphones for noise suppression. The secondary microphone at the top was an
    unshielded inductive loop antenna, picking up 65 times more electromagnetic rumble
    from the overhead transmission towers than the bottom microphone. Isolating the
    bottom microphone gave us clean speech buried under the noise. And I did not leave
    it there as a single lucky fix. In a recent Ramblin' monologue, I walked right
    back out under those same high-tension wires. I walked up the rise toward the
    conductors to deliberately re-attempt the scenario that caused the original disruption.
    I wanted to see if the interference would hit the phone again, and whether our
    dehum filter was a brittle one-off or a reproducible general-purpose tool.
  act_5: 'That field re-test gets to the heart of our cautionary tale. When you prompt
    a frontier model outside your domain, it hands you equations and DSP code with
    total, unblinking fluency. It makes you look like an audio engineering expert.
    But you are throwing a ball high into the air. If you throw it too high, far beyond
    your ability to verify and catch it, it comes crashing straight down on your head.
    Was our filter a permanent engineering asset, or an overfitted artifact of a single
    chat session? When we ran the re-attempt footage through the same deterministic
    pipeline, the parameters held. It ran in 40 milliseconds, stripped the hum, and
    preserved clean voice. But the warning remains: AI models can reach far beyond
    accessible, verifiable competence. They simulate mastery without comprehension,
    like the Chinese room in Peter Watts'' Blindsight. Our job as engineers is not
    to marvel at synthetic fluency. Our job is to walk back under the wires, test
    the boundaries, and machine the output into deterministic code we own.'
  act_6: 'That is the spirit of The Sound Above. Across this 37-episode series, we
    are going to rewatch fifteen years of conversations from the Software Craftsmanship
    movement, from the early Chicago user groups to the AI horizon, examining how
    developers tackled architecture, testing, and autonomy before commercial platforms
    took over. Full transcripts, telemetry, and companion code are open at just3ws.com.
    If you want to help support our independent hosting and archive preservation,
    check out patreon.com/whoistechcmty. In Episode 1, we dive into the very first
    room: Sergio Pereira and Chicago Alt.NET. Until next time: keep your feedback
    loops fast, and verify your code.'
