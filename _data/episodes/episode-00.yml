teleprompter_script:
  act_1: |
    [SCENE: Camera. Show the original phone recording.]
    I took my phone for a walk under the power lines.
    I was recording a few thoughts about software craftsmanship.
    When I got home, I heard a loud hum in the audio.
    The video was about twenty-one minutes long.
    The audio was about eighteen minutes long.
    I thought the phone had lost sync.
    [PAUSE]
    This is Studio Workbench. I'm Mike Hall.
    I'll show what I checked, what I got wrong, and what worked on a second walk.
  act_2: |
    [SCENE: Show the suggested command and the original recording.]
    I asked an AI tool how to repair the audio.
    It compared the two track durations and suggested speeding up the audio.
    The proposed setting was atempo equals 0.837.
    I tried it. The speech sounded slow and out of sync.
    [SHOW: Play a short before and after sample.]
    The command ran. The result was wrong.
    I needed to find out what those extra three minutes contained.
  act_3: |
    [SCENE: Inspect the end of the video and the audio waveform.]
    I checked the point where the audio ended.
    I said "Thank you" and finished speaking.
    Then I kept walking with the camera running.
    The last few minutes were silence, not a sync problem.
    [SHOW: Play the end of the original recording.]
    The duration difference came from the walk after I finished talking.
    Stretching the audio had changed speech that was already in sync.
    [PAUSE]
    The recording answered the question. I had to listen to it.
  act_4: |
    [SCENE: Show the two audio channels and their spectra.]
    The phone recorded two audio channels.
    One channel carried much more of the hum.
    The other had clearer speech.
    I isolated the clearer channel and reduced the remaining hum.
    [SHOW: Compare the channels before and after cleanup.]
    I wanted to know whether those steps would work on another recording.
    So I went back to the same trail with the same phone.
  act_5: |
    [SCENE: Run the same cleanup on the second recording.]
    The second recording had the same kind of hum.
    I used the same channel selection and cleanup steps.
    The speech stayed clear, and the hum came down.
    I did not stretch the audio.
    [SHOW: Compare the original and cleaned audio.]
    The second recording showed which parts of the first repair were useful.
    The duration ratio was not.
  act_6: |
    [SCENE: Outro card with the recording and source links.]
    I thought the recording was out of sync.
    Listening showed that I had walked in silence after the talk.
    The second recording helped me test the audio cleanup separately.
    A useful check is simple: compare the output with the source.
    The recording, notes, and code are linked from just3ws.com.
    Thanks for spending time with me at the workbench.
