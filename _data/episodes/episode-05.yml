teleprompter_script:
  act_1: 'Welcome back to The Sound Above. I am Mike Hall, and this is Episode 5,
    the closing chapter of Movement 1: The Chicago Workshop. Today we revisit my GOTO
    Chicago 2014 conversation with Ryan Gerry, alongside our earlier SCMC reflections
    with Jim Suchy. This episode is deeply personal for me, because it is the story
    of how we built a technical community fifty miles outside downtown Chicago in
    McHenry County, and how Ryan Gerry kept that room alive every single month for
    seventeen years.

    '
  act_2: 'In October 2009, at the first Software Craftsmanship North America conference,
    I walked up to a table at lunch and introduced myself to Ryan Gerry: ''Hi, I am
    Mike, where are you from?'' It turned out we lived fifteen minutes apart in far
    northwest McHenry County, where there were zero developer user groups. Right at
    that table, we decided to start one. We launched CDG, the Cloud Developers Group,
    meeting in public library rooms, Panera Bread backrooms, and upstairs at Duke''s
    Alehouse in Crystal Lake. In 2010, after eighteen months, we partnered with Jim
    Suchy from 8th Light to focus on hands-on coding katas and rebranded as Software
    Craftsmanship McHenry County. Ryan secured a permanent home for us at Follett
    Software Company, and attendance jumped fifty percent overnight.

    '
  act_3: 'Here is our core inquiry for Episode 5: What sustains a local engineering
    community for seventeen straight years without corporate marketing budgets or
    paid speakers, and what does it take to hand over the torch when your own bandwidth
    hits a wall? A real community is not built on one founder''s ego. When my travel
    and conference schedule made it impossible to show up every month, Ryan Gerry
    carried SCMC forward year after year without missing a beat.

    '
  act_4: 'Let us roll the GOTO Chicago 2014 conversation with Ryan Gerry (YouTube
    ID: gBQfB84aqW4). Listen to how Ryan describes the rhythm of those monthly kata
    sessions, the partnership with Follett and 8th Light, and what happens when suburban
    developers have a dedicated room to practice their craft together.

    '
  act_5: 'What does a seventeen-year continuous room teach us in 2026? Hype cycles
    come and go. When Ryan and I first met in 2009, cloud computing was the brand-new
    wave; today it is agentic AI. The tools change every five years, but the need
    for a high-trust room where working engineers can sit down, test ideas against
    reality, and learn from peers without posturing never changes.

    '
  act_6: 'Thank you for joining Episode 5 and completing Movement 1 of The Sound Above.
    Full transcripts, SCMC archive recordings, and our 17-year community hub are online
    at just3ws.com/scmc/. To help underwrite our independent compute and archive preservation,
    visit patreon.com/whoistechcmty. In Episode 6, we begin Movement 2: The Practice
    and the Dojo, starting with Corey Haines on Coderetreat and deliberate practice.
    Until next time: keep your feedback loops fast, and your code humane.

    '
