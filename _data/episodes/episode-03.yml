teleprompter_script:
  act_1: 'Welcome to The Sound Above. I am Mike Hall, and this is Episode 3. In our
    last episode, Ray Hightower told me over lunch at Midway Restaurant that I needed
    to drive up to Libertyville on a Friday and visit a group of developers at 8th
    Light. Today we revisit my SCNA conversations with 8th Light co-founder Micah
    Martin and craftsman Mike Jansen on Pair Friday, 8th Light University, and the
    apprenticeship model that helped spark the Software Craftsmanship movement.

    '
  act_2: 'I still remember the cultural shock of walking up the stairs into 8th Light''s
    second-floor office in downtown Libertyville in the winter of 2008. Coming from
    enterprise Windows shops with heavy Visual Studio builds and isolated cubicles,
    that room looked like another world. Long tables were set up with dual keyboards
    and monitors. Developers like Micah Martin, Eric Smith, Eric Meyer, Colin Jones,
    and Jim Suchy were pairing in Vim and tmux, running RSpec suites that finished
    in milliseconds, while MelodySheep''s Symphony of Science Carl Sagan remixes played
    across the room. Anyone from the community could walk in on a Friday, sit down
    at a keyboard, and write test-driven code side by side with a working craftsman.

    '
  act_3: 'Here is our core inquiry for Episode 3: How is real engineering judgment
    transmitted from one practitioner to another? You cannot learn software design
    purely from a textbook or a vendor certification. At 8th Light, apprenticeship
    meant sitting next to someone who held the code to a rigorous standard, writing
    the failing test first, keeping the feedback loop under a second, and explaining
    the trade-offs out loud at 8th Light University.

    '
  act_4: 'Let us roll the archive conversations with Micah Martin and Mike Jansen
    (YouTube ID: GwYGODSJWgM). Listen to how they describe the origins of their apprenticeship
    program, the transition from Libertyville into downtown Chicago, and why opening
    their doors to the community every week was central to how they built their engineering
    culture.

    '
  act_5: 'Think about what Pair Friday teaches us about working with AI coding agents
    in 2026. Pairing with an LLM agent requires the exact same discipline as pairing
    with an eager apprentice at those Libertyville tables. If you let an apprentice
    write five hundred lines of untested code without a clear boundary, you get a
    tangle you cannot maintain. If you work in small, verifiable steps, keep your
    terminal feedback loop fast, and enforce clean interfaces at every seam, both
    human and machine stay aligned with the architecture.

    '
  act_6: 'Thank you for joining Episode 3 of The Sound Above. Full transcripts, chapter
    markers, and links to our Libertyville timeline notes are available at just3ws.com.
    To support our independent compute and archive preservation, visit patreon.com/whoistechcmty.
    In Episode 4, we sit down with Dave Hoover of Obtiva to explore Geekfest and the
    psychology behind Apprenticeship Patterns. Until next time: keep your feedback
    loops fast, and your code humane.

    '
