  act_3: |
    [CUE: Play / pause at 00:17:28 - 00:18:55]
    [SHOW: Transcript excerpt - "Prickles and Goo... gooey prickles and prickly goo"]
    At 17 minutes in, Watts splits thinkers into prickles and goo.
    Prickles want hard edges, discrete atoms, exact rules.
    Goo wants flow, continuity, intuition, the whole picture at once.
    And Watts reminds the room: nature isn't one or the other. It's prickly goo and gooey prickles.
    [FREEFORM: Connect this directly to engineering with LLMs today.
    Pure "goo" is shipping raw probabilistic agent output without tests or types.
    Pure "prickles" is pretending heuristics and natural language have no place in tooling.
    The real craft is pairing deterministic harnesses, ledgers, and compilers (prickles)
    with probabilistic search and synthesis (goo).]

