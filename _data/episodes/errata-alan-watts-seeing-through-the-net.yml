    [CUE: Play / pause at 00:20:26 - 00:23:58]
    [SHOW: Spotlight vs Floodlight & The Gallbladder Specialist excerpts]
    Around 20 minutes, Watts contrasts spotlight attention with floodlight attention.
    A spotlight gives you blinding clarity on one small patch while everything around it goes dark.
    A few minutes later, he tells the story of the gallbladder specialist
    who studies one organ so intensely that every human being looks like a walking gallbladder.
    [FREEFORM: Tie this to your Nov 7 Ramblin' & Amblin' observation about consciousness filtering out the world.
