teleprompter_script:
  act_1: "Welcome to The Sound Above: Special Presentation. I am Mike Hall. Today we are talking about cards, state machines, and why making rules legible is the deepest responsibility of software craftsmanship. In July 2022, during a rainy week at Boy Scout Camp Tesomas in northern Wisconsin, I sat at a wooden picnic table with two standard 52-card decks and a notebook. I wanted to design a two-player tactical card duel that eliminated random dice rolls and mid-match shuffles entirely. Every outcome had to flow strictly from the cards visible on the table and the deliberate choices each player made. That rainy camp experiment became Phalanx Duel."
  act_2: "To prove the rules worked, I started where many craftsmen start: with executable code. I wrote a Ruby prototype to test combat resolution, card suits, and damage movement. In Phalanx Duel, each player controls an eight-card formation arranged in two ranks across four columns. When an attack strikes a column, damage must chew through the front-rank vanguard and rear-rank flank before it can touch the player's Life Points. The rules were simple enough for two scouts to play on a soggy bench, yet precise enough to run identically in software. But a working prototype is only the beginning of systems engineering."
  act_3: "The real challenge came when turning tabletop rules into a live, multiplayer architecture. In late 2022 and 2023, I rebuilt Phalanx Duel from the ground up as a server-authoritative TypeScript platform. Many game architectures make the mistake of trusting the client to resolve moves. In Phalanx Duel, the client never dictates state; it merely sends player intent over a WebSocket connection. The server ingests that intent, validates it against the current deterministic state, computes the next transition, and records the exact action in an immutable ledger. What a table verifies with physical cards is what the server enforces on every single turn."
  act_4: "That brings us to a fundamental architectural lesson: determinism is necessary, but it is not sufficient. An engine can be 100 percent deterministic while executing completely flawed business logic. To bridge that gap, Phalanx Duel implements replay fingerprints, action verification hashes, and role-safe projections. The authoritative server maintains complete match state, including facedown cards. But when broadcasting updates, it projects only role-safe information: Player 1 sees their private hand, Player 2 sees theirs, and spectators receive a time-delayed broadcast. The protocol itself becomes an active guardian of the game's integrity."
  act_5: "In September 2026, I brought these materials to Software Craftsmanship McHenry County for a live talk titled Make the Rules Legible. We looked at how OpenTelemetry traces bugs across the transport layer, and how Model Context Protocol tools allow AI agents to observe and play matches. But notice the boundary: the AI model is not the authority. The model is merely an actor submitting intent through a strict schema. The deterministic engine remains the sole arbiter of truth. When the rules are legible, neither a network packet nor a hallucinating language model can corrupt the shared reality."
  act_6: "Today, Phalanx Duel runs live in production at phalanxduel.com with automated release pipelines, containerized deployments, and a competitive Glicko-2 ladder. But its true value is as an architecture laboratory. The lessons learned under that soggy Wisconsin pavilion: server authority, deterministic replay, visible boundaries, and zero-indirection state transitions: are the exact same disciplines needed to modernize enterprise monoliths and financial ledgers. Thank you for joining this special presentation. You can download the rules, inspect the engine, and play a match at just3ws.com. Keep your rules legible, your boundaries explicit, and your systems safe to change."
