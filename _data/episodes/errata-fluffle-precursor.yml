  topic: "Fluffle: Five Raspberry Pis and 1K+ Transcript Pairs"
  plot_arc:
    inciting_incident: More than two hundred UGtastic interviews sat without searchable transcripts, and paid transcription was beyond the project's budget.
    rising_action: In 2023, Mike used Dead Rabbit Radio episodes as a test set and built Ruby scripts to distribute whisper.cpp work across five Raspberry Pis.
    climax: The cluster produced more than a thousand matching text and subtitle pairs. The attempt to turn the experiment into a general podcast tool ran into broken feeds and more work than Mike could sustain.
    resolution: The project stopped, but its queueing, audio preparation, and transcription experiments informed later work on the UGtastic archive.
  core_inquiry: What did the five-Pi experiment accomplish, where did it stop, and which lessons carried forward?
  chicago_context: This is one small, documented experiment in the longer effort to make community interviews searchable.
  ai_era_parallel: Early ChatGPT helped draft parts of the orchestration code. Mike still had to run the system, inspect its results, and decide what to do next.
teleprompter_script:
  act_1: |
    [SCENE: Cam on desk setup, MacBook visible]
    I want to start with this sticker.
    [SHOW: Close-up of Dead Rabbit Radio sticker on MacBook lid]
    Right there on the lid of the MacBook Air, next to the Apple logo.
    It came from Dead Rabbit Radio, a podcast I listened to while working on a transcription experiment.
    This is The Sound Above: Minus One. I'm Mike Hall.
    I built a system that spread transcription work across five Raspberry Pis.
    I'll show what it did, where I stopped, and what I reused later.
  act_2: |
    [SCENE: Show one of the original UGtastic recordings.]
    I had more than two hundred interviews on disk and no practical way to search them.
    Paying someone to transcribe the full collection was outside the budget for this community project.
    The automated services I tried struggled with software names.
    I wanted to find out whether local speech recognition could help.
    [SHOW: A short example of the old transcript, if available.]
  act_3: |
    [SCENE: Show whisper.cpp and the Fluffle repository.]
    In 2023, I started trying whisper.cpp on my own hardware.
    I did not want my first tests to be on the UGtastic archive.
    I chose Dead Rabbit Radio because it had many episodes with one regular speaker.
    That gave me a useful test set before I worked on the interviews.
  act_4: |
    [SCENE: Show the Fluffle repository and the Raspberry Pi setup, if available.]
    I had five Raspberry Pis at home.
    Ruby scripts divided the recordings, sent work to the boards, and collected the output.
    Each board ran whisper.cpp, then waited two minutes before taking another file.
    [SHOW: The distribution script and one worker command.]
    It was a small system, built to answer a practical question: could these boards get through the test set?
  act_5: |
    [SCENE: Show the completed transcript folder, then return to camera.]
    The repository now has more than a thousand matching text and subtitle files.
    I contacted Jason to explain the experiment and ask whether he was comfortable with it. He replied kindly.
    I then tried to make the tool work with many different podcast feeds.
    Feed formats and audio metadata varied, and I had other work that needed my attention.
    I stopped working on the broader tool.
  act_6: |
    [SCENE: Show a current UGtastic transcript beside its source recording.]
    Fluffle did not become a universal podcast tool.
    It gave me practice with distributing work and checking transcripts against the audio.
    I used some of that experience when I later returned to the UGtastic recordings.
    Thanks to Jason for making the show and for being kind when I contacted him about the experiment.
    Next, I look at a field recording that I initially thought was out of sync.
