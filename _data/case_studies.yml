case_studies:
  - id: onemain-acquisition
    title: "OneMain Financial: Acquisition Workflow Modernization & Enterprise Telemetry"
    role: "Associate Director, Staff Engineer"
    period: "2021: 2026"
    company: "OneMain Financial"
    domain: "High-Volume Personal Financial Services"
    summary: >-
      Served as Software Architect for the Acquisition Lane, the customer-facing path through application and account workflows, with an executive mandate to untangle multi-channel lending funnels, decouple boundaries between Acquisition and Originations, engineer an automated 5-phase PII deletion engine across 30+ tables, and deploy enterprise OpenTelemetry distributed tracing.
    dimensions:
      interaction_surface: "Mapped browser, mobile, automated API, and affiliate partner ingress points across seven heterogeneous acquisition funnels."
      lateral_state_dependencies: "Mapped 40+ applicant database tables, isolated legacy clarity_ and underwriting_ orphan data, and architected an automated 5-phase PII deletion engine."
      full_stack_topology: "Led enterprise OpenTelemetry deployment across Rails microservices, MuleSoft integration layers, and IBM mainframes to establish the unified Enterprise Trace."
      supply_chain_exposure: "Audited third-party credit bureau APIs, e-sign vendor webhooks, and boundary ingress points, providing real-time causal event chains for cybersecurity and fraud investigations."
    outcomes:
      - "Diagnosed and resolved a persistent session-cookie overflow defect affecting 4% of digital applicant traffic by implementing custom rescue middleware and migrating Rails session state to AWS DynamoDB with zero downtime."
      - "Engineered an automated 5-phase PII remediation engine across 30+ tables, eliminating legacy orphan references without disrupting live application state."
      - "Established end-to-end distributed tracing across Acquisition and Origination tiers, accelerating root-cause diagnosis for Incident Command."
      - "Founded and technically led Acquisition Lane enablement while leading a 3-year enterprise community arc through Geekfest@OMF and the OpenTelemetry Working Group, then transitioned ongoing stewardship to SRE."

  - id: phalanx-duel-engine
    title: "Phalanx: Duel: Tabletop Rules to Multiplayer Engine"
    role: "Creator, Principal Architect"
    period: "2022: 2026"
    company: "Phalanx: Duel"
    domain: "Multiplayer Tactical Game & Engine (phalanxduel.com)"
    summary: >-
      Designed a tactical card duel at Boy Scout Camp Tesomas in 2022 and prototyped its combat rules in Ruby. Rebuilt it as a server-authoritative TypeScript engine, with a deterministic engine package kept separate from the transport layer, a Go CLI, a TypeScript SDK, and an experimental SwiftUI client, now running live at phalanxduel.com.
    dimensions:
      interaction_surface: "WebSocket protocol (createMatch, joinMatch, watchMatch, action, authenticate) paired with an OpenAPI 3.0 REST surface for matchmaking, ladder, and replay, a TypeScript SDK, a Go CLI (duel-cli), and an experimental SwiftUI iOS client, all built against one shared schema contract."
      lateral_state_dependencies: "8-stage turn state machine (StartTurn through EndTurn) enforcing Target Chain, Boundary, and Carryover combat semantics, with Postgres storing match state, action history, and transaction logs as JSONB alongside Glicko-2 Elo snapshots tracked per ladder category."
      full_stack_topology: "TypeScript monorepo separating a transport-only server from a deterministic, transport-free engine package, backed by Postgres via Drizzle, Docker-built deploys, Sentry error tracking, and an OTel Collector feeding OTel/LGTM observability across the server and Go client."
      supply_chain_exposure: "AGPLv3 open-source codebase with 40+ operational wiki and docs guides, an independent combat verifier that checks 2,355,388 declared finite cases and pins a SHA-256 result digest, and CI-gated rule, replay, and playthrough verification ahead of every release."
    outcomes:
      - "Built an explainable battle engine that records a versioned, step-by-step combat calculation for every attack, with named operands, ordered operators, and stable PD-RULE identifiers, driving live damage previews, narration, and spectator replay."
      - "Verified the combat engine against an independent reference checker covering 2,355,388 declared finite cases, pinning a SHA-256 result digest as a bounded correctness proof."
      - "Kept game state synchronized across WebSocket and REST paths for TypeScript, Go, and Swift clients, using role-specific projections and knowledge-safety tests that keep hidden hand and deck information out of what any client can see."
      - "Shipped a live production platform (phalanxduel.com) with an automated release pipeline that builds an immutable GHCR container image, promotes it after health and readiness checks, and rolls back to the last known-good image on failure."
