    role: "Associate Director, Staff Engineer"
    period: "2021 — 2026"
    company: "OneMain Financial"
    domain: "High-Volume Personal Financial Services"
    summary: >-
      Led team boundaries realignment and implemented OpenTelemetry distributed tracing across high-volume loan application services.
