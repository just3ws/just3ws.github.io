  rationale: Punchy 60-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 3
  text: It's a project I've been working on. I've been working on it for a very long
    time, but I didn't really have a name for it. But what it is, it's just a set
    of patches on top of ActiveRecord. Like, it's just stuff that I've been doing
    on top of ActiveRecord, specifically for performance, like performance improvements
    to ActiveRecord.
  feeds_task: TASK-258
  status: proposed
