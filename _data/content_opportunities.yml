  title: Adam Grandy on Podcasting And Community Media
  kind: short
  speaker: Adam Grandy
  rationale: Punchy 36-word insight from WindyCityRails
  sources:
  - slug: adam-grandy-windycityrails-2012
    turn_index: 21
  text: Now, the other thing is, is that you're not a developer, but you watch these
    conferences and you've been doing it for years and you watch all the speakers
    get up and they have their talks.
