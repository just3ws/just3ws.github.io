  speaker: Adam Grandy
  rationale: Punchy 50-word insight from WindyCityRails
  sources:
  - slug: adam-grandy-windycityrails-2012
    turn_index: 11
  text: I think as it relates to user groups, what we've found is, you know, if you're
    recording the user group audio or video with the intent of distributing it for
    people to view or listen to, usually, you know, for user groups, you're working
    with volunteers or whatnot like that.
  feeds_task: TASK-258
  status: proposed
