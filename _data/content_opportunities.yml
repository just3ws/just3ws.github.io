  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 40-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 45
  text: Which is where, yes, exactly. Or where, so like, that's, I mean, that's why
    I love doing what I do. And I'm happy to think about that. It makes me happy that
    people are making money with software I write.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-47
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
