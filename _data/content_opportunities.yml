  rationale: Punchy 38-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 49
  text: I can remember if it's Gorby Puff or just Gorby. Well, well, his full name
