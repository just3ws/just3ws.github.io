- id: short-aaron-kalin-chicagowebconf-2012-turn-3
  title: Aaron Kalin on Conference Speaking And Presentation Skills
  kind: short
  speaker: Aaron Kalin
  rationale: Punchy 42-word insight from ChicagoWebConf
  sources:
  - slug: aaron-kalin-chicagowebconf-2012
    turn_index: 3
  text: "\" And I had no idea what I was getting into. But I'm sort of like a Boy
    Scout, I want to be prepared so I started researching online. Just like trying
    to get prepared for it, like getting in the mindset."
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-kalin-chicagowebconf-2012-turn-5
  title: Aaron Kalin on Conference Speaking And Presentation Skills
  kind: short
  speaker: Aaron Kalin
  rationale: Punchy 74-word insight from ChicagoWebConf
  sources:
  - slug: aaron-kalin-chicagowebconf-2012
    turn_index: 5
  text: "\" Well, so I guess the huge difference is that when it's a presentation
    it's actually a bit more about you, especially if like you're one of the scenic
    conferences where they announce the speakers really early before they close call
    for proposals. I've been one of those where they like directly invite you with
    the exception of I think WindyCityRails, but it's not to where like people are
    coming to see you directly."
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-kalin-chicagowebconf-2012-turn-11
  title: Aaron Kalin on Conference Speaking And Presentation Skills
  kind: short
  speaker: Aaron Kalin
  rationale: Punchy 53-word insight from ChicagoWebConf
  sources:
  - slug: aaron-kalin-chicagowebconf-2012
    turn_index: 11
  text: I'm used to presenting where it's like, yeah, hey, these are my stories. This
    is my, you know, subject I want to talk about, all that stuff, but then switching
    that completely off and trying to keep that, you know, curb and not try to start
    like stealing attention is, is, is difficult.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-kalin-chicagowebconf-2012-turn-15
  title: Aaron Kalin on Conference Speaking And Presentation Skills
  kind: short
  speaker: Aaron Kalin
  rationale: Punchy 65-word insight from ChicagoWebConf
  sources:
  - slug: aaron-kalin-chicagowebconf-2012
    turn_index: 15
  text: You know, get the audience to say something or something like that. Now if
    somebody did go off, I mean, I'm going to presume that nobody went off the rails
    here, but did you learn any techniques like, oh, if somebody is starting to kind
    of rant a bit or hog the mic, was there any like kind of tips or tricks that you
    learned?
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-kalin-chicagowebconf-2012-turn-19
  title: Aaron Kalin on Conference Speaking And Presentation Skills
  kind: short
  speaker: Aaron Kalin
  rationale: Punchy 38-word insight from ChicagoWebConf
  sources:
  - slug: aaron-kalin-chicagowebconf-2012
    turn_index: 19
  text: And then the other technique too is also interjecting with like adding onto
    the conversation. So you sort of step in and you grab the, the mic for a minute
    and then you can disperse it back out.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-kalin-chicagowebconf-2012-turn-21
  title: Aaron Kalin on Conference Speaking And Presentation Skills
  kind: short
  speaker: Aaron Kalin
  rationale: Punchy 30-word insight from ChicagoWebConf
  sources:
  - slug: aaron-kalin-chicagowebconf-2012
    turn_index: 21
  text: So yeah. So one is kind of a, I want to say like the magicians look over here.
    There's a word for that. I'm just drawing a blank on it.
  feeds_task: TASK-258
  status: proposed
