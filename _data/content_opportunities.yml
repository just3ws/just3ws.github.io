  rationale: Punchy 38-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 47
  text: So, so it feels good and it's fun. And then, and that's overall the vibe you
    give on, on your Twitter and everything is you do the Friday hugs, you have your
    cat, Gorby Puff. Yes, Gorby Puff.
