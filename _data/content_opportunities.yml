  speaker: Aaron Patterson
  rationale: Punchy 51-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 21
  text: Uh, so basically around the same time I was getting into Ruby working on like
    basically working on Mechanize, um, just to do some, oh, automation, like web
    automation stuff. Um, and then around that same time, the 15 minute video came
    out. Oh yeah. That doc filled a blog post.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-27
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
    Team Member | RailsConf 2014
  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 43-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 27
  text: And more fun. Yes, definitely. Uh, so that's how I got introduced, like how
    I was introduced to rails. And then, I don't know, maybe about a year later, I
    got a job. I took a job doing rails development for a startup.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-29
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
    Team Member | RailsConf 2014
  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 48-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 29
  text: I mean, I did a lot of like, basically throughout that time, my open source
    portfolio was growing, I suppose. And, um, uh, so at this startup, I got experience
    doing rails development. Like I didn't really contribute any patches or anything.
    I was just an app developer.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-31
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
    Team Member | RailsConf 2014
  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 30-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 31
  text: Um, but, uh, after that job, I got a job at AT&T and I was doing app development
    there as well, but it turns out that like, Oh, AT&T Interactive.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-37
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
    Team Member | RailsConf 2014
  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 54-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 37
  text: I got a job there and they, um, it turns out they had a lot of Ruby developers
    and a lot of them were using my open source stuff and they also needed patches
    to rails. And I guess like one thing led to another and that's like, that's basically
    how I got involved.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-41
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
    Team Member | RailsConf 2014
  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 41-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 41
  text: So then when you understand like, Oh, it's actually a very tiny percentage,
    which means that there are tons of people using your software, it kind of, it
    blows your mind. It's, it's pretty incredible. So yeah, it was very nice.
  feeds_task: TASK-258
  status: proposed
- id: short-aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014-turn-45
  title: Aaron Patterson on Mike Hall Interviews Aaron Patterson, Ruby Rails Core
