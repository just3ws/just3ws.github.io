  kind: short
  speaker: Aaron Patterson
  rationale: Punchy 26-word insight from RailsConf
  sources:
  - slug: aaron-patterson-ruby-rails-core-team-member-keynote-speaker-railsconf-2014
    turn_index: 15
  text: So, so, so, so from one open source project to another, uh, I'm, I'm making
    the network. I'm going to close all the open source contributors.
  feeds_task: TASK-258
  status: proposed
