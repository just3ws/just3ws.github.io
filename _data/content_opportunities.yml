  kind: short
  speaker: Adam Grandy
  rationale: Punchy 68-word insight from WindyCityRails
  sources:
  - slug: adam-grandy-windycityrails-2012
    turn_index: 9
  text: Yeah, you know, assumptions are common, and they can actually, you know, you
    think one thing and another thing happens. I think, especially when you talk live
    production, a lot of things can happen. And that's where doing things regularly
    and kind of knowing what you're doing really helps. I don't know that I could
