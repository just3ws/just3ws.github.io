meta:
  eyebrow: "An empirical architecture mapping methodology"
  title: "Panoramic View"
  lede: >-
    System Cartography is the empirical discipline of discovering, mapping, and reconciling how a complex platform actually operates. Panoramic View reconciles a system as interested parties understand it with the domain model that encodes its business concepts and the runtime evidence of how it actually behaves. Follow any actor's journey from left to right; at every step, trace the interaction through the system and back with the same fidelity.
  scope: >-
    The unit of inquiry is the intersection of business process and system
    operation. As time and mandate permit, the map can extend beyond an
    interface path to upstream supply chain, external partners, operational
    controls, retention, and archival cold storage.
  origin: >-
    Mike Hall conceived Panoramic View circa 2021–2022, drawing on years of
    production diagnosis, legacy-system ownership, observability, incremental
    modernization, and organizational knowledge recovery. The earliest
    timestamped exported evidence is from September 2023.

actor_scope:
  title: "Any actor. Any interface. The same fidelity."
  text: >-
    An actor is any participant pursuing a goal through a system: a human
    customer or employee, an external organization, an automated service, or an
    agentic AI system. Each encounters an interface that enacts a business
    process—whether that interface is a screen, API, tool, event, or protocol.

flagship_context:
  title: "Rails platforms were the flagship proving ground."
  text: >-
    The flagship applications centered on complex Rails platform systems, then
    traversed beyond Rails itself through actor-facing interfaces, domain rules,
    services, integrations, infrastructure, data changes, and return paths with
    the same evidence discipline.

core_questions:
  - "What do the interested parties understand the system to do?"
  - "Which business process and goal is the actor pursuing through the interface?"
  - "How does the implemented domain model encode those concepts, rules, and state changes?"
  - "What does runtime evidence show the system actually does—and where is the delta?"

reconciliation:
  title: "Three accounts of one system"
  models:
    - name: "Interested-party understanding"
      text: "The process, outcome, rules, and responsibilities customers, operators, Product, leadership, and other stakeholders believe the system supports."
    - name: "Implemented domain model"
      text: "The business concepts, relationships, constraints, decisions, and state transitions encoded in software and data."
    - name: "Observed runtime behavior"
      text: "What source, state changes, traces, logs, integrations, and external effects show the system actually does."
  delta: >-
    Panoramic View maps the correspondences and gaps among all three. The goal is
    a complete-enough account for the defined decision scope, with contradictions,
    confidence, provenance, and unknowns still visible.

operating_sequence:
  - name: "Stabilize"
    summary: "Make immediate risk, ownership, and safe operating boundaries visible."
  - name: "Understand"
    summary: "Build a shared model of the journey, system behavior, decisions, evidence, and unknowns."
  - name: "Innovate"
    summary: "Modernize from an evidence-backed map instead of an aspirational diagram."

dimensions:
  - name: "The journey moves across"
    summary: >-
      The actor enters stage left, moves through a business process, pauses or
      branches, and eventually exits stage right with an outcome.
    label: "Horizontal axis"
  - name: "Each interaction moves down and back"
    summary: >-
      A choice descends from the interface through application, service,
      integration, and data layers. The response rises through those layers and
      becomes the next state presented to the actor.
    label: "Vertical axis"
  - name: "Evidence and meaning travel together"
    summary: >-
      Runtime signals, source history, recordings, state changes, and human
      knowledge are correlated with interested-party understanding, the
      implemented domain model, actual system operation, ownership, confidence,
      contradictions, and explicit unknowns.
    label: "Context axis"

discovery_loop:
  - title: "Define the premise"
    text: "Name the actor, intended outcome, starting state, and question the investigation must answer."
  - title: "Traverse the next interaction"
    text: "Follow the request and response through every observable technical and business layer."
  - title: "Cross the boundary"
    text: "Bring in the person who understands the next ownership, domain, or system boundary."
  - title: "Capture evidence"
    text: "Record behavior, state changes, transformations, decisions, absences, provenance, and confidence."
  - title: "Synthesize and repeat"
    text: "Update the model, mark contradictions and gaps, then continue until the required path is navigable."

vocabulary:
  title: "Words that help us talk about the work"
  lede: >-
    I found many of these ideas by doing the work before I knew their established
    names. Start with the plain-language idea. Use the related terms when they
    help you find the conversation or explain it to someone else.
  note: >-
    These terms overlap, but they are not interchangeable. The plain-language
    description is the source of meaning here.
  mappings:
    - plain: "The system already has a rhythm."
      related: "Operational cadence, feedback control, and phase alignment"
      meaning: "Observe the repeated movement before changing it. Look for drift, breaks, and changes in tempo."
    - plain: "Follow the actor's journey through the system."
      related: "Service blueprinting, value-stream mapping, and domain storytelling"
      meaning: "Connect the actor's goal and visible experience to the work, decisions, and systems behind it."
    - plain: "Each choice creates a wave down and back."
      related: "Distributed tracing and request-response flow"
      meaning: "Trace a request through interfaces, application code, services, integrations, data, and the response that returns."
    - plain: "Compare what people believe with what the system does."
      related: "Model reconciliation and socio-technical sensemaking"
      meaning: "Place stakeholder understanding, the implemented domain model, and runtime evidence beside one another."
    - plain: "Bring in the person who understands the next boundary."
      related: "Boundary spanning and cross-functional collaboration"
      meaning: "Treat ownership and context as part of the system map, not as private knowledge outside it."
    - plain: "Give different groups a map they can use together."
      related: "Boundary object"
      meaning: "Create a shared artifact that Product, Engineering, Operations, and leadership can each read from their own perspective."
    - plain: "Observe, adjust, and observe again."
      related: "Closed-loop control and double-loop learning"
      meaning: "Change the action, then question the assumptions and goals when the result does not match the intended outcome."
    - plain: "Learn what normal looks like before extracting anything."
      related: "Behavioral baseline and service characterization"
      meaning: "Measure the current pattern before modernization so the later change can be compared with evidence."
    - plain: "The system can run too hot or too cold."
      related: "Control band, setpoint, deadband, and SLO boundaries"
      meaning: "Define a useful operating range with upper and lower signals instead of treating only failure as important."
    - plain: "Keep uncertainty visible."
      related: "Provenance, confidence tracking, and explicit unknowns"
      meaning: "Record where a claim came from, how strong it is, and what remains unresolved."
    - plain: "Communication paths become architecture."
      related: "Conway's Law and socio-technical congruence"
      meaning: "Compare the dependencies in the software with the communication and ownership structure around it."
    - plain: "Hotpath mapping is one view of the larger map."
      related: "Critical-path analysis and journey prioritization"
      meaning: "Use frequency, business importance, or risk to choose where to begin without mistaking the first slice for the whole system."

practice_areas:
  - title: "Legacy System Modernization"
    text: >-
      Mapping complex business paths through legacy codebases to de-risk upgrades,
      refactoring, and architecture splits under production load.
  - title: "Cross-System Integration & Cartography"
    text: >-
      Connecting actor experiences to microservices, asynchronous message flows,
      third-party integrations, and data persistence layers.
  - title: "Engineering Alignment & Governance"
    text: >-
      Establishing a shared operational picture so Product, engineering teams,
      and leadership reason from correlated execution reality rather than guesswork.
