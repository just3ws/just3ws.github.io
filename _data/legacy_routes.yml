---
# Declarative Legacy Route Mappings and Resolution Patterns
# Used by bin/generate_legacy_route_map.rb to produce assets/data/legacy_route_map.json
# and evaluated in 404.html to recover archived traffic arriving from legacy domains.

domain_fallbacks:
  ugtastic.com: "/ugtastic/"
  www.ugtastic.com: "/ugtastic/"
  whoistech.com: "/series/the-sound-above/"
  whoistechcmty.com: "/series/the-sound-above/"
  chicagocodecamp.com: "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  www.chicagocodecamp.com: "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  scmchenry.org: "/scmc/"
  www.scmchenry.org: "/scmc/"
  scmchenry.com: "/scmc/"
  www.scmchenry.com: "/scmc/"
  ugl.st: "/timeline/community/"
  ironlanguages.net: "/timeline/community/"

exact_routes:
  # Chicago Code Camp Routes
  "/chicagocodecamp": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/chicagocodecamp/": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/codecamp": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/codecamp/": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/sessions": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/sessions/": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/speakers": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/speakers/": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/schedule": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/schedule/": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/sponsors": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/register": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"
  "/faq": "/backlog/docs/wayback/snapshots/20121228074319-https-chicagocodecamp-com-80/"

  # Software Craftsmanship McHenry County (SCMC) Routes
  "/scmc": "/scmc/"
  "/scmc/": "/scmc/"
  "/scmchenry": "/scmc/"
  "/scmchenry/": "/scmc/"
  "/mchenry": "/scmc/"
  "/mchenry/": "/scmc/"
  "/meetings": "/scmc/"
  "/meetings/": "/scmc/"
  "/dojo": "/scmc/"

  # UGtastic Legacy Application Routes
  "/ugtastic": "/ugtastic/"
  "/ugtastic/": "/ugtastic/"
  "/interviews": "/interviews/"
  "/interviews/": "/interviews/"
  "/interview": "/interviews/"
  "/interview/": "/interviews/"
  "/interviewees": "/interviews/people/"
  "/interviewees/": "/interviews/people/"
  "/interviewers": "/interviews/people/"
  "/interviewers/": "/interviews/people/"
  "/people": "/interviews/people/"
  "/people/": "/interviews/people/"
  "/groups": "/timeline/community/"
  "/groups/": "/timeline/community/"
  "/groups/locations": "/timeline/community/"
  "/categories": "/timeline/community/"
  "/channels": "/series/the-sound-above/"
  "/channels/": "/series/the-sound-above/"
  "/calendar": "/timeline/community/"
  "/calendar/": "/timeline/community/"
  "/calendar/index": "/timeline/community/"
  "/blog": "/"
  "/blog/": "/"
  "/blogs": "/"
  "/posts": "/"
  "/posts/": "/"
  "/about": "/about/"
  "/about/": "/about/"
  "/contact": "/contact/"
  "/contact/": "/contact/"
  "/feed": "/feed.xml"
  "/rss": "/feed.xml"
  "/feeds": "/feed.xml"
  "/archive-atlas": "/archive-atlas/"
  "/archive-status": "/archive-status/"
  "/videos": "/videos/"
  "/videos/": "/videos/"

pattern_rules:
  - pattern: "^/interviews?/([^/]+)/transcript/?$"
    target_template: "/interviews/%{slug}/#transcript"
    description: "Legacy interview transcript route"

  - pattern: "^/interviews?/([^/]+)/?$"
    target_template: "/interviews/%{slug}/"
    description: "Legacy interview single item route"

  - pattern: "^/interviewees?/([^/]+)/?$"
    target_template: "/interviews/people/%{slug}/"
    description: "Legacy interviewee profile route"

  - pattern: "^/people/([^/]+)/?$"
    target_template: "/interviews/people/%{slug}/"
    description: "People shorthand route"

  - pattern: "^/groups?/([^/]+)/?$"
    target_template: "/timeline/community/"
    description: "Legacy user-group detail route"

  - pattern: "^/channels?/([^/]+)/?$"
    target_template: "/series/the-sound-above/"
    description: "Legacy channel detail route"

  - pattern: "^/posts?/([^/]+)/?$"
    lookup: "posts"
    fallback: "/"
    description: "Legacy blog post route resolved via post slug index"

  - pattern: "^/blog/([^/]+)/?$"
    lookup: "posts"
    fallback: "/"
    description: "Legacy blog single route resolved via post slug index"
