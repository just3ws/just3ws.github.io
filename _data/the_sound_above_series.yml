  teleprompter_script: |
    [SCENE: 02. Monologue / Full Camera.]
    Early in my career, when I felt completely overwhelmed by the volume of software literature I could not understand, a veteran engineer gave me a piece of advice that changed how I work.
    He told me: 'Read books you don't understand, and keep reading books that you don't understand. Eventually, you will understand the ones you've read.'

    That advice taught me that true comprehension starts at the boundary of confusion.
    By sitting with difficult systems and wrestling with stubborn code, you build the perceptual organs necessary to comprehend the architecture.

    In the ancient parable, Cook Ding's cleaver stayed as sharp as a newly whetted razor after nineteen years because he never hacked at the bone.
    He guided the blade through the open seams where the joints naturally meet.

    In an era where probabilistic machines generate mountains of unverified syntax, do not hack at the bone.
    Keep your automated feedback loops tight, design clean deterministic seams, and keep reaching for the sound above the level you are on.

