    description_citation: "Intro audio citation: Brief 25.7-second excerpt of Marcus Parks from No Dogs in Space (Series 3: Can, 2024), hosted by Marcus Parks and Carolina Hidalgo on The Last Podcast Network. Used under fair use (17 U.S.C. 107) for commentary, criticism, and educational framing. Listen to the full four-part Can series on No Dogs in Space."
  voiceover_hook: |
    [SCENE: 01. Starting Soon (Hold on Starting Soon card for voiceover intro).]
    Who did Jimi Hendrix listen to?

