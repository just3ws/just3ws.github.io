  teleprompter_script: |
    [SCENE: 01. Starting Soon (Hold on Starting Soon card for voiceover intro).]
    If you want to really appreciate Jimi Hendrix, you ask one question: who did Jimi Hendrix listen to?
    When you go back and hear the players who influenced him, you gain a deeper feel for his music.

    Back in June of 2024, Marcus Parks and Carolina Hidalgo were exploring the German band Can on their music history show, No Dogs in Space.
    Marcus described their music as: 'A sound above their own level. If artists only listen to what they already know how to make, they just make more of the same. But when you reach for something you do not quite understand, your brain builds new pathways.'

    That is the core idea behind The Sound Above.
    Rather than meeting the room at eye level with predictable formulas, great artists hold a higher standard and challenge the audience to climb up to meet them.

    [SCENE: Switch to 02. Monologue / Full Camera.]
    [PAUSE]
    Welcome to The Sound Above. I am Mike Hall.

    Between 2005 and 2015, a community of working developers around Chicago and North America gathered in suburban libraries, diner booths, and corporate basements.
    We were pushing back against corporate vendor defaults, exploring test-driven development, and reaching for the sound above our current level.

    I recorded more than two hundred of those working developers in hotel hallways, conference lounges, and meetup rooms for an oral history project called UGtastic.
    Those tapes were preserved for over a decade.

    Today, in 2026, the tech industry is obsessed with artificial intelligence and rapid code generation.
    We are generating syntax at blinding speeds, but system comprehension is disappearing.
    We are at risk of losing our institutional memory.

    I am revisiting those original field recordings one by one, with verified transcripts, era-specific Wayback captures, and recovered source code right beside the tape.
    Not for backward-looking nostalgia, but because the effort of understanding is not overhead: the effort is the point.

