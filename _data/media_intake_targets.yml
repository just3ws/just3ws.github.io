      marginalia:
        playlist_id: "PLCun5kLIQkSQ"
        series_name: "UGtastic Marginalia"
        archetype: "historical_marginalia"
        purpose: |
          Historical UGtastic channel artifacts that provide institutional context for the project
          but do not fit the main series archetypes. This includes early channel update videos,
          community pronunciation guides, working notes, and documentary footage spanning the
          founding era of UGtastic (2012 onward). These materials are the connective tissue
          between the archived interview record and the living engineering community that
          produced it.
        default_privacy: "public"
        category_id: "28"
        auto_title_from_speech: false
        transcribe_with_whisper: false
        intro_structure: "State the era, channel context, and what the clip documents; place it in the broader UGtastic timeline."
        outro_structure: "Connect the historical artifact to the active engineering community and current just3ws.com archive."
        tags:
          - "UGtastic"
          - "Software Craftsmanship"
          - "Chicago Tech"
          - "SCMC"
          - "Tech Community"
          - "Archive"
          - "Chicago Software Craftsmanship"
        description_template: |
          UGtastic Marginalia: Institutional context and historical artifacts from the UGtastic era.
          Curated by Mike Hall (Staff Software Engineer & SCMC Co-Founder)

          UGtastic (2012-2018) was the community video production arm of the Chicago Software
          Craftsmanship Community. This playlist preserves channel updates, pronunciation guides,
