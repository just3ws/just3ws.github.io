# _data/media_intake_targets.yml
# Media Intake Pipeline Configuration
# Maps local intake directories to YouTube publishing targets and series dossiers.
# Lifecycle states:
#   staged/     Pre-intake storage: held on local SSD until ready to queue
#   pending/    Ingress queue: watched by pipeline for automated ingestion
#   processing/ Active atomic execution: audio DSP, whisper.cpp, YouTube upload
#   processed/  Archived completed masters: organized by YYYY-MM on local SSD
#   failed/     Quarantined failures with diagnostic error notes
#   blocked/    Temporarily deferred (e.g. daily quota reset cooldown)
#
base_path: "~/.local/var/media_intake"
cloud_archive_path: "/Users/mike/Library/CloudStorage/GoogleDrive-mike@just3ws.com/My Drive/Media Intake"

channels:
  whoistechcmty:
    channel_handle: "@whoistechcmty"
    targets:
      ramblin-amblin:
        playlist_id: "PLNtb969T2-l0"
        series_name: "Ramblin' & Amblin'"
        archetype: "freeform_field_notes"
        purpose: "Freeform field notes recorded on the move: engineering observations, systems architecture, career longevity, and practitioner reflections."
        default_privacy: "unlisted"
        category_id: "28"
        auto_title_from_speech: true
        title_prefix: "Ramblin' & Amblin'"
        ephemerality:
          enabled: true
          mode: "anchor_gravitational_tail"
          window_days: 3
          carry_tail_count: 2
          active_privacy: "public"
          retired_privacy: "private"
          vault_playlist_id: "PLYCKmHMYvC7s"
          vault_playlist_title: "Ramblin' & Amblin' (Sovereign Vault)"
        intro_structure: "State setting and location immediately; introduce the spark or observation that triggered the reflection within 60 seconds; frame the core inquiry."
        outro_structure: "Synthesize the freeform reflection back to a durable engineering principle; provide an actionable takeaway for daily craft or career resilience; grounded sign-off."
        tags:
          - "Software Craftsmanship"
          - "Ramblin and Amblin"
          - "Field Notes"
          - "Engineering Philosophy"
          - "Chicago Tech"
        description_template: |
          Ramblin' & Amblin' Field Notes with Mike Hall (Staff Software Engineer)
          Recorded on the move: engineering observations, systems architecture, and software craftsmanship reflections.

          • Series Playlist: https://www.youtube.com/playlist?list=PLNtb969T2-l0
          • The Sound Above Curriculum: https://www.just3ws.com/series/the-sound-above/
          • Canonical Profile: https://www.just3ws.com

      the-sound-above:
        playlist_id: "PLVcmLmfz2uyA"
        series_name: "The Sound Above"
        archetype: "technical_rewatch"
        purpose: "Structured 6-act rewatch broadcasts where Mike Hall revisits the 15-year UGtastic interview archive through the lens of modern Staff/Principal engineering, domain boundaries, and sovereign verification."
        default_privacy: "unlisted"
        category_id: "28"
        dossier_lookup: true
        intro_structure: "Act 1 Cold Open & Personal Grounding: State the era and movement, introduce the guest, and share an unvarnished personal recollection from the room. Act 2: Historical scene setting."
        outro_structure: "Act 6 Community Coda & Outro: Synthesize the enduring technical lesson for today's practitioner; provide independent compute underwriting Patreon callout (patreon.com/whoistechcmty); preview next episode; signature sign-off ('Keep your feedback loops fast, and your code humane')."
        tags:
          - "The Sound Above"
          - "Software Craftsmanship"
          - "UGtastic Technical Rewatch Series"
          - "Chicago Software Craftsmanship"
          - "Engineering Ethics"
        description_template: |
          The Sound Above: UGtastic Technical Rewatch Series (Chicago Software Craftsmanship)
          Hosted by Mike Hall (Staff Software Engineer & SCMC Co-Founder)

          • Interactive Series Hub: https://www.just3ws.com/series/the-sound-above/
          • Archive Index & Verified Transcripts: https://www.just3ws.com/interviews/
          • Community & Patreon Support: https://www.patreon.com/whoistechcmty

      errata:
        playlist_id: "PLKPAHha6I990"
        series_name: "The Sound Above: Errata"
        archetype: "structured_errata"
        purpose: "Solo technical demonstrations, forensic audio/DSP deep dives, code reviews, BPMN workflow walkthroughs, and edge-case postmortems exploring the mechanics behind the systems."
        default_privacy: "unlisted"
        category_id: "28"
        intro_structure: "State the specific failure, vendor myth, or AI hallucination being examined; define the target objective and scope of inspection."
        outro_structure: "Demonstrate the deterministic solution; provide verifiable test or code repository references; state the defensive rule of thumb to prevent the issue in production."
        tags:
          - "The Sound Above"
          - "Errata"
          - "Audio Recovery"
          - "DSP"
          - "Software Craftsmanship"
        description_template: |
          The Sound Above: Marginalia, Readings & Demonstrations (Errata Series)
          Recorded with Mike Hall (Staff Software Engineer & SCMC Co-Founder)

          • Errata Playlist: https://www.youtube.com/playlist?list=PLKPAHha6I990
          • Interactive Cockpit: https://www.just3ws.com/dehum/
          • Canonical Case Study: https://www.just3ws.com/ai/2026/10/12/under-the-high-tension-wires-building-deterministic-tools-from-nondeterministic-systems/

      phalanx-duel:
        playlist_id: "PLHenvAZhJjHo"
        series_name: "Phalanx Duel"
        archetype: "game_architecture_and_demos"
        purpose: "Demonstrations, design retrospectives, architectural walkthroughs, and guest presentations exploring Phalanx Duel from tabletop rules to deterministic multiplayer engine."
        default_privacy: "unlisted"
        category_id: "28"
        transcribe_with_whisper: true
        transcribe_prompt: "Phalanx Duel, tactical card duel, SCMC, Camp Tesomas, Life Points, combat rules, state machine, carryover, suits, formation, Diamonds, Hearts, Clubs, Spades, Conrad Hall, Mike Hall"
        intro_structure: "State the version and focus of the demonstration; introduce the game board setup and core mechanics."
        outro_structure: "Connect the demonstration to deterministic systems design and provide links to the live platform and open source rules."
        tags:
          - "Phalanx Duel"
          - "Game Architecture"
          - "Software Craftsmanship"
          - "Deterministic Systems"
          - "Tabletop Games"
          - "State Machines"
          - "SCMC"
        description_template: |
          Phalanx Duel: Tabletop Rules to Deterministic Multiplayer Engine
          Created by Mike Hall & Conrad Hall

          • Play Live: https://phalanxduel.com
          • SCMC Presentation & Quickstart: https://www.just3ws.com/phalanx-duel/
