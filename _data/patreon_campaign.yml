welcome_post:
  status: "draft"
  visibility: "public"
  title: "Hi, I'm Mike"
  body: >-
    I'm Mike Hall. Online, I'm just3ws. I started this page to connect the work I
    make without pretending these projects are all the same thing.

    I founded Cloud Developers Group with Ryan Gerry, was a lead co-founder of
    Software Craftsmanship McHenry County, and built the Chicago Code Camp
    website. Through UGtastic and later WHOIS Tech Community, I recorded more
    than 200 interviews. I created Phalanx Duel and Panoramic View, and now I'm
    making Ramblin' & Amblin'—a video series whose shape I'm still working out.

    Some episodes are personal. I'm figuring out what I want to share, how to
    give each episode a shape, and how to make the process sustainable. I'll
    post here when I have something useful to show: a topic taking form, a
    production lesson, or an archive update.

    The public videos and archive stay on their own sites. I decide what to
    publish, and membership doesn't open private recordings. I'm not promising
    a posting schedule while I refine the series.

    If you came here through one project, the map of my current work and its
    history is at https://www.just3ws.com/support/.

editorial_principles:
  - "Write from Mike's first-person perspective; these are his observations and experiences."
  - "Keep Ramblin' & Amblin' and the historical interview archive distinct, while connecting them through Mike's creator identity."
  - "Describe member extras only when they are enabled and sustainable to deliver."
  - "Never promise individual credits, private access, early releases, consulting, or a delivery cadence by implication."
  - "Do not publish patron names or membership details without explicit permission."
  - "Use verifiable dates and project roles; use the project history as context, not as a list of inflated claims."
