about: >-
  I'm Mike Hall. I use just3ws online. I've spent much of my life making things
  with people: software, communities, and ways for people to learn from one another.

  I founded Cloud Developers Group with Ryan Gerry in 2009 and was a lead
  co-founder of Software Craftsmanship McHenry County. I built the Chicago Code
  Camp website from 2010 through 2012. Through UGtastic and later WHOIS Tech
  Community, I recorded more than 200 interviews. That archive is one continuing
  project, even as its name changed.

  Today I work on Phalanx Duel, the Panoramic View system-cartography method, and
  Ramblin' & Amblin'. The videos are a newer, more personal chapter: I work through
  ideas in my own voice while I figure out the series' shape.

  Across these projects, I keep coming back to the same things: helping people
  grow, helping teams deliver, and making useful work together.

