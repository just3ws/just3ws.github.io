studio_note_sample:
  title: "What a photograph can tell us"
  provenance: "An example Studio Note, prepared with AI assistance from this timeline and its curation record."
  paragraphs:
    - "A photograph can preserve a moment without settling every detail about it. While putting this timeline together, I kept the date of an event separate from the date I photographed its traces."
    - "The TicketsNow notes are one example. They describe teaching from my time there, but I photographed the pages in 2021. Calling that a 2021 teaching event would change the story."
    - "The Phalanx Duel notebook has a similar limit. Its photograph records the notebook and pen in July 2022. It does not establish the first day I started designing the game."
    - "The gallery copies are smaller web images with embedded metadata removed. Their captions currently describe the event; individual photograph descriptions are still being developed."
    - "This is the kind of work I can show in a Studio Note: a small decision, the evidence behind it, and what remains open."
  links:
    - label: "See the TicketsNow notes and their date evidence"
      url: "/timeline/lived-history/#ticketsnow-scrum"
    - label: "See the Phalanx Duel notebook"
      url: "/timeline/lived-history/#phalanx-duel-notebook-origin"

welcome_post:
  status: "draft"
  visibility: "public"
  title: "A workbench for works in progress"
  body: >-
    Hi, I'm Mike. I'm using this page for the workbench notes that sit between
    finished pieces: what I'm testing for Studio Workbench and Ramblin' &
    Amblin', why a piece of software broke the way it did, or what it takes to
    keep the old interview archive running.

    I've spent years building software and user groups. I helped start Cloud
    Developers Group in 2009, co-founded Software Craftsmanship McHenry County,
    built the Chicago Code Camp website, and recorded more than 200 interviews
    through UGtastic and WHOIS Tech Community.

    I also spend a lot of time helping engineers get unstuck. At Groupon I
    built onboarding and training programs. Later I ran Geekfest@OMF for over a
    year and started an OpenTelemetry Working Group from 2024 through 2025 so
    teams could actually see what their systems were doing. At Assembly, I led
    Coderwall's move into open source.

    Right now I'm building Phalanx Duel, writing down the Panoramic View
    mapping method, and recording Studio Workbench and Ramblin' & Amblin'. The
    videos are still finding their shape, and I decide what belongs in public.

    I'll share a note when I have something real to show rather than on a fixed
    schedule. Public videos and interviews stay free in their usual places;
    membership doesn't unlock private recordings.

    You can see all the connected projects at https://www.just3ws.com/support/.

editorial_principles:
  - "Write from Mike's first-person perspective; these are his observations and experiences."
  - "Keep Ramblin' & Amblin' and the historical interview archive distinct, while connecting them through Mike's creator identity."
  - "Describe member extras only when they are enabled and sustainable to deliver."
  - "Never promise individual credits, private access, early releases, consulting, or a delivery cadence by implication."
  - "Do not publish patron names or membership details without explicit permission."
  - "Use verifiable dates and project roles; use the project history as context, not as a list of inflated claims."

