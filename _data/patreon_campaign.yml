about: >-
  I'm Mike Hall, and I use just3ws online. I build software and communities,
  preserve the stories people tell about the work, and share what I'm learning
  along the way.

  I helped start Cloud Developers Group in 2009 and handled most of its initial
  setup. I was a lead co-founder of Software Craftsmanship McHenry County
  (SCMC), and built the Chicago Code Camp website from 2010 through 2012.
  Through UGtastic, later WHOIS Tech Community, I recorded more than 200
  interviews. It is one continuing interview and community-history project
  across those names.

  Today I create Phalanx Duel and the Panoramic View method, and make Ramblin' &
  Amblin'. The videos are personal and still taking shape. I talk through
  software, systems, work, and ideas I'm trying to understand. I decide what I
  make public.

  Across the projects, I keep coming back to the same things: helping people
  learn, helping teams deliver, and making useful work together.

