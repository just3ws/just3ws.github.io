welcome_post:
  status: "draft"
  visibility: "public"
  title: "Hi, I'm Mike"
  body: >-
    Hi, I'm Mike Hall. I use just3ws online. I made this page to share the work
    I'm doing and the ideas I'm still thinking through.

    I've spent years building software and communities, helping teams deliver,
    and helping people grow. I founded Cloud Developers Group with Ryan Gerry,
    was a lead co-founder of Software Craftsmanship McHenry County, and built the
    Chicago Code Camp website. Through UGtastic and WHOIS Tech Community, I
    recorded more than 200 interviews.

    These days I'm making Ramblin' & Amblin', working on Phalanx Duel, and
    developing the Panoramic View system-cartography method. The video series is
    new, and I'm finding its format as I go.

    I'll share an occasional studio note when I have something worth showing: a
    topic taking shape, something I learned making a video, or progress on the
    archive. There isn't a fixed schedule; I want the work to stay thoughtful
    and sustainable.

    My public videos and archive remain on their own sites. I choose what to
    publish. You can find the project map at https://www.just3ws.com/support/.

editorial_principles:
  - "Write from Mike's first-person perspective; these are his observations and experiences."
  - "Keep Ramblin' & Amblin' and the historical interview archive distinct, while connecting them through Mike's creator identity."
  - "Describe member extras only when they are enabled and sustainable to deliver."
  - "Never promise individual credits, private access, early releases, consulting, or a delivery cadence by implication."
  - "Do not publish patron names or membership details without explicit permission."
  - "Use verifiable dates and project roles; use the project history as context, not as a list of inflated claims."
