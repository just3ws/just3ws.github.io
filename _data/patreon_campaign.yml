welcome_post:
  status: "draft"
  visibility: "public"
  title: "A workbench for works in progress"
  body: >-
    Hi, I'm Mike Hall. Online, I use just3ws. I'm making this page a place for
    the notes that sit between finished things: how I shape a Ramblin' &
    Amblin' topic, a decision from building software, or a step in caring for
    the interview archive.

    I've spent years building software and communities. I helped start Cloud
    Developers Group in 2009 and handled most of its initial setup. I was a
    lead co-founder of Software Craftsmanship McHenry County, built the Chicago
    Code Camp website, and recorded more than 200 conversations through UGtastic
    and WHOIS Tech Community.

    These days I make Ramblin' & Amblin', create Phalanx Duel, and develop the
    Panoramic View method. The video series is still finding its format. Some
    episodes are more personal than others, and I decide what belongs in public.

    I'll share a note when I have something worth showing. There isn't a set
    publishing schedule. Public videos and interviews will remain in their usual
    places; membership won't unlock private recordings.

    You can find the connected projects at https://www.just3ws.com/support/.

editorial_principles:
  - "Write from Mike's first-person perspective; these are his observations and experiences."
  - "Keep Ramblin' & Amblin' and the historical interview archive distinct, while connecting them through Mike's creator identity."
  - "Describe member extras only when they are enabled and sustainable to deliver."
  - "Never promise individual credits, private access, early releases, consulting, or a delivery cadence by implication."
  - "Do not publish patron names or membership details without explicit permission."
  - "Use verifiable dates and project roles; use the project history as context, not as a list of inflated claims."
