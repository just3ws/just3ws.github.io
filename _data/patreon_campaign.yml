about: >-
  I'm Mike Hall. Online, I'm just3ws. I want my work connected to my own name while
  each project keeps its identity and community.

  I founded Cloud Developers Group with Ryan Gerry in 2009 and was a lead co-founder
  of Software Craftsmanship McHenry County. I built the Chicago Code Camp website
  from 2010 through 2012. Through UGtastic and later WHOIS Tech Community, I recorded
  more than 200 interviews with people in software communities. Those names mark
  different chapters of one continuing archive.

  I created Phalanx Duel and Panoramic View, and I make Ramblin' & Amblin'—videos
  where I work through ideas in my own voice. I'm still learning the format and
  deciding how personal I want each episode to be.

  Much of my work has been about making useful things with other people: helping
  teams deliver, helping individuals grow, and building communities where people
  can learn from each other. Patreon is a way to support that independent work as
  a whole. It can give me more room for production, archive care, and tools; it
  doesn't promise that funds are divided equally between projects.

  I'll share notes and works in progress here when I have something I want to show.
  My decisions about what to publish remain mine. Membership doesn't include access
  to private recordings, and I'm not setting a schedule while I refine the series.

