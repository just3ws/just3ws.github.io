title: "Mike Hall"
short_description: >-
  I'm Mike Hall. I build software, help teams untangle tricky systems, record
  conversations with working engineers, and think out loud at the workbench
  about what actually holds up over time.
about: >-
  I'm Mike Hall. I build software and communities, keep the stories people
  tell about this craft from disappearing, and share what I figure out along
  the way.

  Back in 2009 I helped start Cloud Developers Group and handled most of the
  early legwork. I co-founded Software Craftsmanship McHenry County (SCMC), and
  I built the Chicago Code Camp website from 2010 through 2012. Through
  UGtastic, later WHOIS Tech Community, I recorded more than 200 interviews
  with developers and organizers. Different names, one continuous archive.

  A lot of my day job has been helping engineers get their footing. At
  Groupon I built onboarding and training programs. Later I started
  Geekfest@OMF and ran peer-learning sessions for over a year, then founded
  an OpenTelemetry Working Group from 2024 through 2025 so teams had real
  observability they could own themselves. At Assembly, I led Coderwall's
  move into open source.

  Right now I'm building Phalanx Duel, writing down the Panoramic View
  mapping method, and recording Studio Workbench and Ramblin' & Amblin'. Some
  videos are walk-throughs of old code and hardware experiments; others are
  just me walking through an idea I'm still trying to pin down. I decide what
  goes out in public.

  Across all of it, the thread is the same: help people learn, keep systems
  legible, and do honest work together.

