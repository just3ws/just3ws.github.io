# _data/patreon_campaign.yml
# Canonical Patreon Campaign Profile & Founding Mission Statement
# WHOIS Tech Community (@whoistechcmty)

campaign_url: "https://www.patreon.com/whoistechcmty"
channel_handle: "@whoistechcmty"
initiative: "WHOIS Tech Community"
historical_website: "WHOISTechCmty.com"
founder: "Mike Hall"
era: "2011 - Present"
tagline: "Tools for everything"
purpose: "Independent compute underwriting, oral history preservation, and humanizing the people who make tech communities, user groups, and open-source software possible."

manifesto: |
  Supporting WHOIS Tech Community will bring you more interviews with fascinating people with higher production quality. I'll be able to spread the interviews across a larger swathe of communities and bring you a better understanding and awareness of the cool people in tech. I believe in the life changing value of tech community and know how much work goes into even small user-groups and conferences as well as OSS projects. Most of the people creating and coordinating these works are working behind the scenes and often go unrecognized. I seek these people out and put them in front of a camera to learn more about what they are doing and why they are doing it. My goal is to help with humanizing and increasing awareness of the cool people who make tech community possible. Since 2011 I've conducted over 200 interviews with tech leaders both famous and not so famous. I've learned a lot about the equipment and interviewing techniques and the interviews have slowly been improving both technically and content-wise. I need help though to grow past the current state. Going to conferences and collecting the equipment has been quite expensive and I want to avoid advertising entanglements. I want WHOIS Tech Community to be 100% focused on people doing cool stuff without worrying about which tool or vendor I need to please. If you support WHOIS Tech Community then you will help me to purchase better equipment that will lead to higher production values for interviews. I will be able to spend more time on developing the WHOISTechCmty.com website to build better profiles and interesting ways to promote individuals in tech community. And most importantly I'll be able to dedicate more time to seeking out and interviewing fascinating people in tech. This will help you to learn about the people who are in your community that you might not even be aware of.

core_pillars:
  - id: "unrecognized_organizers"
    label: "Humanizing Unrecognized Organizers"
    description: "Most of the people creating and coordinating user groups, conferences, and OSS projects work behind the scenes and often go unrecognized. We put them in front of a camera to learn what they are doing and why."
  - id: "avoid_advertising_entanglements"
    label: "Zero Advertising Entanglements"
    description: "100% focused on people doing meaningful engineering without worrying about which vendor or tool must be pleased."
  - id: "independent_compute_and_equipment"
    label: "Independent Compute & Craftsmanship"
    description: "Community-backed audio DSP, sovereign transcription, equipment acquisition, and open digital humanities archiving."
