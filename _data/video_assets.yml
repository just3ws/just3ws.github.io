  thumbnail: https://i.ytimg.com/vi/Hn0FNJfiWBs/maxresdefault.jpg
  thumbnail_local:
  duration_seconds:
  duration_minutes:
  description: "The talk discusses the importance of inclusivity in software development
    and how developers can better understand and cater to marginalized users by considering
    their diverse experiences and identities. The speaker, Karina Sisona, draws parallels
    between her work as a sex educator and her observations of software development,
    highlighting the lack of awareness of diverse user experiences and the potential
    for software to reinforce biases and exclusions.\n\nRecorded as part of the Technical
    Conversation Archive and UGtastic historical movement.\nRailsConf 2014 Chicago
    (Rails 4.1), GOTO Chicago 2014, Continuous Delivery boom with Jez Humble, Brakeman
    security adoption.\n\n\U0001F4D6 Interactive Transcript & Notes: https://www.just3ws.com/interviews/interview-with-carina-c-zona-general/\n\n⏱️
