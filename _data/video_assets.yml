  thumbnail: https://i.ytimg.com/vi/WV0AtDZSq3Q/hqdefault.jpg
  thumbnail_local:
  duration_seconds:
  duration_minutes:
  description: "Mandy Walls, a technical evangelist with Opscode, discusses the role
    of a technical evangelist, the work done at Opscode, and the importance of diversity
    in the technical community. She explains that technical evangelists help customers
    understand Chef, an open-source platform for managing servers, and that Opscode
    runs a user conference, ChefConf, where anyone using Chef can submit talks. Mandy
    also touches on the challenges of organizing and reviewing proposals for the conference
    and her interest in increasing diversity in the technical community.\n\nRecorded
    as part of the Technical Conversation Archive and UGtastic historical movement.\nRailsConf
    2014 Chicago (Rails 4.1), GOTO Chicago 2014, Continuous Delivery boom with Jez
