  thumbnail: https://i.ytimg.com/vi/7IQilJtLtx0/hqdefault.jpg
  thumbnail_local:
  duration_seconds:
  duration_minutes:
  description: "The Amsterdam Movement is a global community focused on technology
    and innovation, aiming to create a constant sense of inspiration and collaboration
    through regular meetups, events, and workshops. It emphasizes the importance of
    creativity, commerce, and delivering products, rather than just technical expertise.
    The movement has been quantitatively researched by the University of Amsterdam,
    showing a significant increase in technical businesses and events in cities where
    Amsterdam is present.\n\nRecorded as part of the Technical Conversation Archive
    and UGtastic historical movement.\nRailsConf 2014 Chicago (Rails 4.1), GOTO Chicago
    2014, Continuous Delivery boom with Jez Humble, Brakeman security adoption.\n\n\U0001F4D6
