  interview_id: interview-with-katrina-owen-general
  title: Katrina Owen on Software Engineering | UGtastic Archive
  primary_platform: youtube
  source:
  published_date: '2022-04-24'
  thumbnail: https://i.ytimg.com/vi/qXfDi_BjtMk/maxresdefault.jpg
  thumbnail_local:
  duration_seconds:
  duration_minutes:
  description: "The talk discusses the importance of code reviews and the potential
    biases that can arise from them. It highlights the need to consider the context
    and pressures under which code was written, rather than making assumptions about
    the person who wrote it. The speaker emphasizes the importance of being kind and
    realistic in code reviews, and the value of conversations that focus on understanding
    the humanity of the person who wrote the code.\n\nRecorded as part of the Technical
    Conversation Archive and UGtastic historical movement.\nRailsConf 2014 Chicago
    (Rails 4.1), GOTO Chicago 2014, Continuous Delivery boom with Jez Humble, Brakeman
