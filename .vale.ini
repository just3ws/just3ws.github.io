StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Tech

Packages = Google, proselint, write-good, Readability

[*.{md,html,markdown}]
BasedOnStyles = Just3Ws, proselint, write-good

# Voice-preserving policy
#
# Mike's writing is first-person, concrete, and conversational. It uses
# intentional fragments, contractions, questions, repetition, and visible
# turns such as “I digress.” These are reviewed by a human when they carry
# meaning. The linter should identify risks without flattening that voice.
write-good.ThereIs = NO
write-good.E-Prime = NO

# Noise suppression for technical prose
write-good.TooWordy = suggestion
write-good.Weasel = suggestion
write-good.Passive = suggestion
write-good.So = suggestion
write-good.Cliches = suggestion
write-good.Illusions = suggestion
proselint.Typography = NO
proselint.Diacritical = NO
proselint.GenderBias = suggestion
proselint.But = suggestion
proselint.Very = suggestion

# Ignore Liquid tags, Jekyll frontmatter, and code fences
TokenIgnores = ({%[\\s\\S]*?%}), ({{[\\s\\S]*?}}), (<figure[\\s\\S]*?<\/figure>)
BlockIgnores = (?s)({%[\\s\\S]*?%}), (?s)(```mermaid[\\s\\S]*?```)
